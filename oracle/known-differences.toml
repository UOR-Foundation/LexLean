# oracle/known-differences.toml --- the known deliberate differences between
# LexLean and the differential oracle (SPEC.md §17.19).
#
# Every way LexLean and `lean4-prod` differ on a root of the corpus is a
# difference with a kind and a name; one that no row below names is a
# disagreement and fails the differential. A row is exact: it lists the roots
# it is known on, and a listed root on which the difference no longer arises
# fails the run, so the table can neither hide a new difference nor outlive
# an old one. A change to a row raises `version`, and the digest of the rows
# at each version is recorded in `oracle/table-versions.toml`, which fails the
# run when the rows and the version disagree.

spec = "lexlean/oracle-differences/1"
version = 4

[[difference]]
id = "KD-01"
kind = "acceptance"
key = "oracle-refuses:escaping-local-function"
reason = "The oracle lowers a local function only when it is saturated, non-escaping, and acyclic (its subset contract). The Lean LexLean generates for these roots holds a local function that escapes: a lambda or function reference handed to another definition, the step closures LexLean's ordered-collection folds and iterations take, the structural-recursion helpers Lean compiles recursive and nested data to, and the transition functions of model and reasoner elaborations. LexLean realizes these through its own calculus (§17.14); the oracle's domain does not contain them."
roots = [
  "Coverage.Colls.folds",
  "Coverage.Colls.iterations",
  "Coverage.Colls.mapFolding",
  "Coverage.Main.higher",
  "Coverage.Main.treeTotal",
  "Coverage.RecRoots.rewrite",
  "Coverage.RecRoots.roseTotal",
  "Coverage.RecRoots.syntaxTotal",
  "Models.Main.admitCosts",
  "Models.Main.classify",
  "Models.Main.classifyChecked",
  "Models.Main.respond",
  "OracleProbe.ProbeIterate.iterateRoot",
  "OracleProbe.ProbeIterateUntil.iterateUntilRoot",
  "OracleProbe.ProbeListFold.listFoldRoot",
  "OracleProbe.ProbeMapFold.mapFoldRoot",
  "OracleProbe.ProbeSetFold.setFoldRoot",
  "Production.Main.quadruple",
  "Reasoning.Main.doseLevel",
  "Reasoning.Main.planLeft",
  "Reasoning.Main.screenDose",
  "Reasoning.Main.spendLeft",
]

[[difference]]
id = "KD-02"
kind = "acceptance"
key = "oracle-refuses:opaque-lowering"
reason = "The oracle has no monomorphization (its documented limit): a definition that remains parameterized by a type after Lean's compiler lowers to a type expression it has no rendering for. In the Lean LexLean generates these are its generic definitions instantiated at a use site (firstOr, unbox, identity), a definition that takes a function (twice). LexLean monomorphizes at lowering (§17.17)."
roots = [
  "Coverage.Main.records",
  "OracleProbe.ProbeFunctionRef.referenceRoot",
  "OracleProbe.ProbeGeneric.genericRoot",
  "Production.Main.headOr",
]

[[difference]]
id = "KD-03"
kind = "acceptance"
key = "oracle-refuses:unresolved-external-call"
reason = "The oracle's operators are the Nat operations of its subset contract and its own exported definitions; a call of any other constant has nothing to call. Here those are the mathematical-integer operations (Int.neg) and the partner of a mutually recursive pair (isEven and isOdd), which its exporter does not follow, and every definition of the runtime modules a generated module imports (§17.12) that Lean's compiler keeps a call: the ordered-collection templates of maps, sets, and graphs, and the iteration the reasoners run with. LexLean realizes the mathematical integer in 64 bits with explicit overflow and compiles mutual recursion through its own structural helpers (§17.13)."
roots = [
  "Coverage.Boundary.groveRoot",
  "Coverage.Colls.graphs",
  "Coverage.Colls.keyTypes",
  "Coverage.Colls.mapOps",
  "Coverage.Colls.setOps",
  "Coverage.Colls.stringGraph",
  "Coverage.Main.intOps",
  "Coverage.Main.mapped",
  "Coverage.Main.parity",
  "Coverage.Prims.pixels",
  "Coverage.Prims.widenings",
  "OracleProbe.ProbeGraphReachable.reachableRoot",
  "OracleProbe.ProbeGraphSuccessors.successorsRoot",
  "OracleProbe.ProbeGraphTopological.topologicalRoot",
  "OracleProbe.ProbeInt.intRoot",
  "OracleProbe.ProbeMapContains.mapContainsRoot",
  "OracleProbe.ProbeMapInsert.mapInsertRoot",
  "OracleProbe.ProbeMapKeys.mapKeysRoot",
  "OracleProbe.ProbeMapLookup.mapLookupRoot",
  "OracleProbe.ProbeMapRemove.mapRemoveRoot",
  "OracleProbe.ProbeMapSize.mapSizeRoot",
  "OracleProbe.ProbeMapValues.mapValuesRoot",
  "OracleProbe.ProbeSetContains.setContainsRoot",
  "OracleProbe.ProbeSetDifference.setDifferenceRoot",
  "OracleProbe.ProbeSetInsert.setInsertRoot",
  "OracleProbe.ProbeSetIntersection.setIntersectionRoot",
  "OracleProbe.ProbeSetRemove.setRemoveRoot",
  "OracleProbe.ProbeSetSize.setSizeRoot",
  "OracleProbe.ProbeSetUnion.setUnionRoot",
  "Reasoning.Main.gatewayLevel",
  "Reasoning.Main.gradeLevel",
  "Reasoning.Main.triageLevel",
  "Reasoning.Main.triageSteps",
]

[[difference]]
id = "KD-04"
kind = "acceptance"
key = "oracle-refuses:codegen-PolymorphicType"
reason = "The oracle refuses a parameterized structure type (its documented limit). For these roots the Lean LexLean generates keeps LexLeanRuntime.Fixed, a type-class dictionary structure parameterized by the scalar type, in the closure (checked conversions between widths and the combined 16- and 32-bit signed operations); the oracle refuses it as a polymorphic type. Other roots at the same widths (the int16Root and int32Root probes) are taken."
roots = [
  "Coverage.Prims.conversions",
  "Coverage.Prims.fixedMiddle",
  "OracleProbe.ProbeConvert.convertRoot",
]

[[difference]]
id = "KD-05"
kind = "acceptance"
key = "oracle-refuses:codegen-UnboundedInt"
reason = "The oracle refuses a mathematical Lean Int that reaches a fixed-width target (its documented policy). LexLean parses and formats decimals through the mathematical integer and realizes it in 64 bits with explicit overflow (§17.13)."
roots = [
  "Coverage.Prims.decimals",
  "Coverage.Prims.formats",
]

[[difference]]
id = "KD-06"
kind = "acceptance"
key = "oracle-refuses:codegen-UnresolvedCall"
reason = "The oracle's operator whitelist has no Nat.succ constructor application. LexLean realizes the successor with explicit overflow (constructor.nat_succ, §17.13)."
roots = [
  "Coverage.Main.builders",
  "OracleProbe.ProbeSucc.successorRoot",
]

[[difference]]
id = "KD-07"
kind = "acceptance"
key = "oracle-accepts:literal-width"
reason = "LexLean refuses a natural literal beyond the target's 64 bits (LLT4005); the oracle exports the literal 18446744073709551616 as a Rust u64 literal, which rustc rejects (the evidence records the oracle's crate failing to compile). LexLean is the stricter and the oracle fails later, at rustc."
roots = [
  "LanguageTwelve.Main.huge",
]

[[difference]]
id = "KD-08"
kind = "behavior"
key = "oracle-crate-does-not-run"
reason = "The oracle renders a pair projection as a field access .fst or .snd on a Rust tuple, which rustc rejects (the evidence records the compile error). A defect of the oracle's code generator, found on LexLean's Lean; LexLean renders the same projections correctly, which RB-06 and SP-11 run."
roots = [
  "Coverage.Main.pairs",
  "Models.Main.flowStep",
  "Models.Main.ledgerFull",
  "Models.Main.ledgerPost",
  "OracleProbe.ProbeFirst.firstRoot",
  "OracleProbe.ProbeSecond.secondRoot",
]

[[difference]]
id = "KD-09"
kind = "contract"
key = "borrowed-parameter"
reason = "The oracle takes a list parameter as a borrowed slice, &[T] (its documented memory profile); LexLean takes List<T>, a shared persistent list, by value. The elements are the same and the differential passes the same ones; how a collection crosses the boundary is a deliberate difference of ABI."
roots = [
  "Coverage.Prims.sequences",
  "OracleProbe.ProbeMapEntries.mapEntriesRoot",
  "OracleProbe.ProbeSetElements.setElementsRoot",
  "Production.Main.sumAll",
]

[[difference]]
id = "KD-10"
kind = "acceptance"
key = "both-refuse:opaque-lowering"
reason = "LexLean rejects these roots (LLT4005: a type parameter of the root, a function it takes whose closure would escape, a phantom type parameter, a universe in its signature; §17.17) and the oracle refuses them as well, for its own reason: after Lean's compiler a type that is still parameterized or a universe has no rendering in its lowering. The verdict is the same and the reason is each side's own; a refusal of one of these roots for any other reason is a disagreement."
roots = [
  "LanguageTwelve.Main.count",
  "LanguageTwelve.Main.identity",
  "LanguageTwelve.Main.pick",
  "LanguageTwelve.Main.twice",
]

[[difference]]
id = "KD-11"
kind = "acceptance"
key = "both-refuse:export-refused"
reason = "LexLean rejects this root (LLT4005: a type with no runtime representation in its signature) and the oracle's exporter refuses it as well, at its own structured stage (prod-export failed), before any lowering. Same verdict, the oracle's own reason."
roots = [
  "LanguageTwelve.Main.positive",
]

[[difference]]
id = "KD-12"
kind = "acceptance"
key = "both-refuse:codegen-OpaqueType"
reason = "LexLean rejects this root (LLT4005: a named type at the boundary that has no runtime representation) and the oracle's generator refuses it as well, at its own structured stage (an opaque type), after the export. Same verdict, the oracle's own reason."
roots = [
  "LanguageTwelve.Main.measure",
]

[[difference]]
id = "KD-13"
kind = "contract"
key = "output-buffer"
reason = "The oracle returns a list result into a buffer its caller passes and answers how many elements it wrote, failing with OutputTooSmall when the buffer is short (its documented memory profile); LexLean returns the list. The differential passes a buffer larger than any case writes and compares the elements written; how a collection crosses the boundary is a deliberate difference of ABI."
roots = [
  "OracleProbe.ProbeMapEntries.mapEntriesRoot",
  "OracleProbe.ProbeSetElements.setElementsRoot",
]
