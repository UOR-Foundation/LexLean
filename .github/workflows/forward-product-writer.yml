# Preparation only. Initial calculus wave, no final fixed point or release acceptance.
name: forward initial product writer (unqualified)
on:
  push:
    branches: [integration/v05-accepted-source-prep-405-20261110]
    paths:
      - .github/workflows/forward-product-writer.yml
      - .github/scripts/forward_product_writer.py
      - .github/scripts/test_forward_product_writer.py
      - .github/scripts/forward_product/**
permissions:
  contents: read
concurrency:
  group: forward-product-writer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  initial-calculus:
    if: github.repository == 'UOR-Foundation/LexLean'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test custody driver
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_forward_product_writer.py'
      - name: Install repository-pinned Rust
        shell: bash
        run: |
          set -o pipefail
          bash .github/retry.sh rustup toolchain install 2>&1 | tee "$RUNNER_TEMP/forward-rust-install.log"
      - name: Install repository-pinned Lean
        shell: bash
        run: |
          set -o pipefail
          bash .github/retry.sh bash -euo pipefail -c 'curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none' 2>&1 | tee "$RUNNER_TEMP/forward-elan-install.log"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          bash .github/retry.sh "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)" 2>&1 | tee "$RUNNER_TEMP/forward-lean-install.log"
      - name: Run bounded official producer
        run: >-
          python3 -B .github/scripts/forward_product_writer.py
          --expected-head "$GITHUB_SHA"
          --out "$RUNNER_TEMP/forward-product-evidence"
      - name: Return same-run evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forward-product-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/forward-product-evidence/*.json
            ${{ runner.temp }}/forward-product-evidence/*.log
            ${{ runner.temp }}/forward-product-evidence/*.tar
            ${{ runner.temp }}/forward-product-evidence/*.patch
            ${{ runner.temp }}/forward-product-evidence/*.txt
            ${{ runner.temp }}/forward-product-evidence/SHA256SUMS
            ${{ runner.temp }}/forward-rust-install.log
            ${{ runner.temp }}/forward-elan-install.log
            ${{ runner.temp }}/forward-lean-install.log
          if-no-files-found: error
          retention-days: 14
