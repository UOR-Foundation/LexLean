# model/authorities.toml --- what this repository cites rather than proves
# (R2, SPEC.md §27.4).
#
# A `some-true` claim is reproduced from an authority and is not established
# here. Each row names the authority well enough for a third party to find it.
# A row that vendors nothing records `checksum = "none"` with the identifier a
# third party verifies instead. A row that vendors a copy of its source names
# it in `vendored` and records `checksum = "sha256:<hex>"`, which
# `cargo xtask validate-model` recomputes from the copy. `realized_by` lists the conformance IDs that are *evidence* this
# repository realizes the cited fact; evidence is not proof, and the meta-gate
# fails the build if any document blurs the two registers.

spec = "lexlean/authorities/1"

