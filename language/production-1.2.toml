# language/production-1.2.toml --- the closed production-eligibility registry
# of language 1.2 (SPEC.md §17.13).
#
# This file is language data: it is embedded in the compiler and hashed into
# the language-1.2 compiler-semantics ID, so changing a disposition changes
# what LexLean accepts and therefore its identity. Every semantic construct
# kind of `lexlean/semantic-module/2` has exactly one row; the conformance
# suite fails when a construct has no row, when a row names no construct,
# and when the compiler's disposition disagrees with its row.

spec = "lexlean/production/1"

[[target]]
id = "rust-core"
statement = "Safe Rust using only the core library: no heap allocation, 64-bit natural and integer representations."
allocation = false
natural_bits = 64
integer_bits = 64

[[target]]
id = "rust-std"
statement = "Safe Rust with the standard library: heap allocation, 64-bit natural and integer representations."
allocation = true
natural_bits = 64
integer_bits = 64

[[effect]]
id = "allocation"
statement = "The realization allocates heap storage; allocation failure stops it with an explicit failure."

[[effect]]
id = "overflow"
statement = "A natural-number or mathematical-integer value outside the target width stops the realization with an explicit overflow failure; it is never wrapped or truncated."

[[effect]]
id = "recursion"
statement = "The realization recurses to a depth bounded only by its input; exhausting the stack stops it with an explicit failure."

