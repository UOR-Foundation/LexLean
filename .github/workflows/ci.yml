      - name: Summarize the run's timing and memory
        if: ${{ !cancelled() }}
        run: ci-parts/atlas-xtask/xtask ci-summary --evidence ci-evidence
      # The join publishes Atlas's verified directory and compares its records
      # with `expected/verify` as the examples leg did; these lines are what it
      # prints when it has, and a join that did not print them fails here.
      - name: Assert native Atlas was verified by the acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F "verify-examples: uor-atlas verified (attestation " ci-evidence/vv.txt
          grep -F "verify-examples: uor-atlas: 347 normalized verification records equal expected/verify (§29.5)" ci-evidence/vv.txt
