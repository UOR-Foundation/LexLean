# The release: a tag becomes evidence, a package, and a set of binaries.
#
# SPEC.md §30.3 fixes what a release publishes and §30.4 when the project is
# complete; §2.3 names the completion release, the first version satisfying
# the complete specification (`0.5.0` when it satisfies §30.4, `1.0.0`
# otherwise). This workflow produces the whole §30.3 artifact set at whatever
# version is tagged and then runs `cargo xtask release-check` over it, so the
# release either meets every criterion or says exactly which it does not.
# Before the completion release the version criterion `source-tag` cannot
# hold, and the job below allows it and no other — at the completion release
# the allowance is vacuous because `release-check` exits zero. The version
# report (`version-output`) is checked at every version: it is the §30.3
# report with the tagged version, whatever that version is.
#
# GitHub Packages has no Cargo registry, so the package this publishes there is
# the container image: `ghcr.io/<owner>/lexlean`, carrying the compiler and the
# pinned Lean toolchain its `verify` command needs. The host binaries, the
# packaged crate, the software bill of materials, the checksums, and the gate
# evidence are attached to the GitHub Release. The crate is proved on every run
# (`crate.yml`: packaged to the same bytes twice, dry-run, checked against the
# checksum the release lists), and a tag uploads the byte-identical crate to
# crates.io only when a credential exists: a `CARGO_REGISTRY_TOKEN` secret in
# the crates.io environment for the owner's first upload, or trusted publishing
# once the owner has configured it (the repository variable
# CRATES_IO_TRUSTED_PUBLISHING). With neither, the release is created without
# the upload and says so (RP-18, #260).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Two cargo transcripts ship as release assets — the gate evidence and the
  # criterion report — so cargo's output must be text, not terminal control
  # sequences someone has to strip before reading.
  CARGO_TERM_COLOR: never

jobs:
  # The tag names a version; the repository fixes one. A release whose tag and
  # workspace version disagree is not a release of this source (§2.3).
  identity:
    name: tag identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      # The image tag a rehearsal may publish, and the switch that keeps it
      # from publishing anything else.
      image_tag: ${{ steps.version.outputs.image_tag }}
      tagged: ${{ steps.version.outputs.tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$tagged" != "$workspace" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} names $tagged; Cargo.toml fixes $workspace (SPEC.md §2.3)"
              exit 1
            fi
          fi
          echo "version=$workspace" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER@L}/lexlean" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A tag is a release: the image carries the version, and the
            # GitHub Release is published below.
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "image_tag=$workspace" >> "$GITHUB_OUTPUT"
            echo "lexlean $workspace (${GITHUB_REF_NAME})"
          else
            # A manual run is a rehearsal: it proves the gate, the five host
            # binaries, and the image on both architectures without naming a
            # version no tag stands behind.
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "image_tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "lexlean $workspace (rehearsal at ${GITHUB_SHA:0:7}; nothing is published)"
          fi

  # The crate on crates.io is the crate this release attaches (#260): proved on
  # every run, a rehearsal included, so a tag is not the first time it is tried.
  crate:
    name: crate readiness
    needs: identity
    uses: ./.github/workflows/crate.yml
    # A reusable workflow is validated at startup against what its caller
    # grants, before any `if` is read: `crate.yml`'s upload job asks for
    # `id-token: write` and names the crates.io secret, so the call grants
    # both or the whole run is a startup failure (rehearsal 40219629854).
    # The upload job itself runs only on a dispatch of `crate.yml`.
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      prerelease: false

  # §30.3 CI evidence: the run of `ci.yml` that was the whole gate on the tree
  # of the tagged commit and passed every job, found by `.github/release-gate.sh`
  # under the rule `ci.yml`'s `plan` applies to a push (§9.4) and recorded with
  # its jobs and the transcripts of its legs. The gate is not run here: run
  # whole on one hosted runner it exceeds the six-hour job limit (the `bdd`
  # recipe alone took over four hours in a rehearsal, with Atlas still to
  # come), so a release gate that re-ran it would never conclude, while the
  # sharded run of the line has already verified the tree.
  gate:
    name: release evidence (the gate run of the tagged commit)
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The second parent of a merge, for the tree comparison.
          fetch-depth: 2
      - name: Locate the gate run of this commit and record it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          RELEASE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUT: release/vv-evidence.txt
        run: |
          set -euo pipefail
          mkdir -p release
          .github/release-gate.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vv-evidence
          path: release/vv-evidence.txt
          if-no-files-found: error

  # §8.3: one binary per supported host, each built natively on that host.
  binaries:
    name: binary (${{ matrix.target }})
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: The runner is the host this binary claims
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::${{ matrix.os }} is $host, not ${{ matrix.target }} (SPEC.md §8.3)"
            exit 1
          fi
      - run: cargo build --locked --release -p lexlean
      # A release binary that cannot report its own identity is not one
      # (§30.3): the report is checked here, on the host that built it,
      # against the §30.3 fence of SPEC.md, the text CL-18 reads. The line
      # count is the fence's — the `lexlean` line, a `language` line and a
      # `compiler-semantics` line per supported language, the `lean-toolchain`
      # line — never a number written here, so a language the fence gains is
      # expected without this file changing, and a report that drops one or
      # keeps the shape of an earlier release is refused. Each ID is a
      # 64-hex-digit digest here, and no more: the exact IDs are compared in
      # `publish`, where `release-check` holds each ID that `release-artifacts`
      # lists and reports from its own build of the tagged source to the ID
      # compiled into that source (`lexlean::compiler_semantics_id_for`), and
      # refuses `semantics-id` and `version-output` on a difference.
      - name: The binary reports the §30.3 identity
        shell: bash
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          binary="target/release/lexlean"
          [ -f "$binary" ] || binary="target/release/lexlean.exe"
          "$binary" --version | tee identity.txt
          # The §30.3 fence, from its `lexlean <version>` line to its close.
          awk 'f == 2 { if ($0 == "```") exit; print; next }
               f == 1 { f = ($0 == "lexlean <version>") ? 2 : 0; if (f == 2) print; next }
               $0 == "```text" { f = 1 }' SPEC.md > expected.txt
          if ! [ -s expected.txt ]; then
            echo "::error::SPEC.md §30.3 has no version report fence beginning \`lexlean <version>\`"
            exit 1
          fi
          expected="$(wc -l < expected.txt | tr -d ' ')"
          lines="$(wc -l < identity.txt | tr -d ' ')"
          if [ "$lines" -ne "$expected" ]; then
            echo "::error::--version printed $lines lines, not the $expected of the §30.3 report"
            exit 1
          fi
          n=0
          while IFS= read -r want; do
            n=$((n + 1))
            got="$(sed -n "${n}p" identity.txt)"
            case "$want" in
              'lexlean <version>') want="lexlean ${VERSION}"; [ "$got" = "$want" ] ;;
              'compiler-semantics <digest>') printf '%s\n' "$got" | grep -Eq '^compiler-semantics [0-9a-f]{64}$' ;;
              *) [ "$got" = "$want" ] ;;
            esac || {
              echo "::error::--version line $n is \`$got\`, not the \`$want\` of the §30.3 report"
              exit 1
            }
          done < expected.txt
          mkdir -p "staged/bin/${{ matrix.target }}"
          cp "$binary" "staged/bin/${{ matrix.target }}/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: staged/bin/${{ matrix.target }}/*
          if-no-files-found: error

  # The GitHub Packages artifact: one image per architecture, built natively,
  # joined into a single multi-architecture tag below.
  image:
    name: image (${{ matrix.platform }})
    # The gate first: a package pushed from a commit whose acceptance gate
    # failed is a published claim with no evidence behind it, and `:latest`
    # cannot be taken back once someone has pulled it.
    needs: [identity, gate]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: amd64 }
          - { os: ubuntu-24.04-arm, platform: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign in to GitHub Packages
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the per-architecture image
        env:
          IMAGE: ${{ needs.identity.outputs.image }}
          IMAGE_TAG: ${{ needs.identity.outputs.image_tag }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          tag="${IMAGE}:${IMAGE_TAG}-${{ matrix.platform }}"
          docker build \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$tag" .
          # The image reports the same identity as the binaries above.
          docker run --rm "$tag" --version
          docker push "$tag"

  # One multi-architecture tag, so `docker pull ghcr.io/<owner>/lexlean:<v>`
  # resolves on either supported Linux host.
  manifest:
    name: multi-architecture tag
    needs: [identity, gate, image]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Sign in to GitHub Packages
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - id: push
        env:
          IMAGE: ${{ needs.identity.outputs.image }}
          IMAGE_TAG: ${{ needs.identity.outputs.image_tag }}
          TAGGED: ${{ needs.identity.outputs.tagged }}
        run: |
          set -euo pipefail
          # `latest` follows released versions only: a rehearsal must not
          # move the tag every other pull of the image resolves to.
          extra=()
          if [ "$TAGGED" = "true" ]; then extra=(--tag "${IMAGE}:latest"); fi
          docker buildx imagetools create \
            --tag "${IMAGE}:${IMAGE_TAG}" "${extra[@]}" \
            "${IMAGE}:${IMAGE_TAG}-amd64" "${IMAGE}:${IMAGE_TAG}-arm64"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${IMAGE_TAG}@${digest}"

  # Assemble the §30.3 artifact set, read the release criterion over it, and
  # publish. This is the only job that writes to the repository.
  publish:
    name: publish the release
    needs: [identity, crate, gate, binaries, manifest]
    # Only a tag is a release. A manual run has already proved the gate, the
    # binaries, and the image by reaching here.
    if: needs.identity.outputs.tagged == 'true'
    environment: crates.io
    env:
      HAS_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      TRUSTED_PUBLISHING: ${{ vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' }}
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Install the bill-of-materials generator
        run: cargo install cargo-cyclonedx --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloaded
      - name: Stage what the fleet produced
        run: |
          set -euo pipefail
          mkdir -p release/bin
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-apple-darwin aarch64-apple-darwin \
                        x86_64-pc-windows-msvc; do
            mkdir -p "release/bin/$target"
            cp "downloaded/bin-$target/"* "release/bin/$target/"
            chmod +x "release/bin/$target/"* || true
          done
          cp downloaded/vv-evidence/vv-evidence.txt release/vv-evidence.txt
      - name: Generate the software bill of materials
        run: |
          set -euo pipefail
          # `-a` writes one document per workspace member, next to each
          # manifest; the shipped crate's is the release artifact and the
          # rest are removed so nothing generated is left in the checkout
          # (`cargo package` reads the shipped crate's directory).
          cargo cyclonedx --format json --spec-version 1.5 -a
          cp crates/lexlean/lexlean.cdx.json release/sbom.json
          find . -name '*.cdx.json' -not -path './target/*' -delete
      - name: Derive the rest of the §30.3 artifact set
        run: cargo xtask release-artifacts
      - name: Read the release criterion over the assembled set
        shell: bash
        run: |
          set -euo pipefail
          # `release-check` refuses until every §30.3 artifact and §30.4
          # criterion holds. §2.3 names the completion release as the first
          # version that can satisfy the version criterion, so before then
          # `source-tag` is expected to be unmet and nothing else is. At the
          # completion release the command exits zero and this allowance is
          # vacuous.
          # The report is written outside `release/`. A shell creates a
          # redirect target before the process it redirects ever runs, so
          # writing it inside would put an unlisted file in the directory
          # whose checksum manifest `release-check` is at that moment
          # reading, and the criterion would report a gap this step made.
          report="${RUNNER_TEMP}/release-check.txt"
          set +e
          cargo xtask release-check > "$report" 2>&1
          status=$?
          set -e
          cat "$report"
          if [ "$status" -ne 0 ]; then
            # A refusal names its criteria. Output that carries no refusal at
            # all is a crash, a missing cargo, or a changed message — not a
            # criterion this allowance may forgive, so the absence of an
            # explanation fails rather than passes.
            if ! grep -q 'the release is refused; unmet criteria:' "$report"; then
              echo "::error::release-check exited $status without refusing any criterion; see the log above"
              exit 1
            fi
            unmet="$(grep -oE '^  [a-z-]+:' "$report" | tr -d ' :' | sort -u)"
            if [ -z "$unmet" ]; then
              echo "::error::release-check refused but named no criterion"
              exit 1
            fi
            unexpected="$(printf '%s\n' "$unmet" | grep -vxE 'source-tag' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::criteria unmet for reasons §2.3 does not explain: $unexpected"
              exit 1
            fi
            echo "the only unmet criterion is the version-bound one §2.3 defers to the completion release"
          else
            echo "release-check: the complete §30 criterion holds"
          fi
          cp "$report" release/release-check.txt
      # Everything that will be attached exists before the checksum manifest
      # is written. Building an asset afterwards is exactly what left
      # `release-check.txt` unlisted on the first run of this workflow.
      - name: Collect the host binaries as one asset
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: tar -czf "release/lexlean-${VERSION}-binaries.tar.gz" -C release bin
      - name: Checksum every assembled file
        run: cargo xtask release-artifacts
      # What cargo would send is what the release attaches and lists (#260):
      # the dry run is cargo's own packaging of the upload, so equality here is
      # equality of the bytes, and the crate job proved the same digest.
      - name: The crate cargo would upload is the crate this release attaches
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          CRATE_SHA256: ${{ needs.crate.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          cargo publish --dry-run --locked --package lexlean --target-dir "${RUNNER_TEMP}/dry"
          # The dry run leaves the archive where its cargo release puts it (1.97:
          # `package/tmp-crate/`), so it is located by name, as in crate.yml.
          dry_crate="$(find "${RUNNER_TEMP}/dry/package" -type f -name "lexlean-${VERSION}.crate" | head -1)"
          [ -n "$dry_crate" ] || { echo "::error::cargo publish --dry-run left no lexlean-${VERSION}.crate under ${RUNNER_TEMP}/dry/package"; exit 1; }
          sha256="$(.github/crate-publication.sh identity release "$dry_crate")"
          if [ "$sha256" != "$CRATE_SHA256" ]; then
            echo "::error::the crate packaged here ($sha256) is not the one the crate job checked ($CRATE_SHA256)"
            exit 1
          fi
          echo "lexlean ${VERSION} sha256 ${sha256}"
      - name: Decide how the upload is authorised
        id: upload
        shell: bash
        run: echo "mode=$(.github/crate-publication.sh mode)" >> "$GITHUB_OUTPUT"
      - name: Acquire crates.io trusted-publisher token
        if: steps.upload.outputs.mode == 'trusted'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: crates-auth
      - name: No upload credential
        if: steps.upload.outputs.mode == 'none'
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: echo "::notice::lexlean ${VERSION} was packaged and dry-run, and is on the GitHub release; no CARGO_REGISTRY_TOKEN and no trusted publishing, so it was not uploaded to crates.io"
      - name: Publish the exact verified crate to crates.io
        if: steps.upload.outputs.mode != 'none'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
          VERSION: ${{ needs.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          packaged="release/lexlean.crate"
          test -f "$packaged"
          expected="$(sha256sum "$packaged" | cut -d' ' -f1)"
          cargo publish --locked --package lexlean
          for attempt in $(seq 1 30); do
            printf 'checking crates.io visibility (attempt %s/30)\n' "$attempt"
            response="$(curl --fail --location --silent --show-error \
              "https://crates.io/api/v1/crates/lexlean/${VERSION}/download" \
              --output "${RUNNER_TEMP}/lexlean-public.crate" && printf ok || true)"
            if [ "$response" = ok ]; then
              actual="$(sha256sum "${RUNNER_TEMP}/lexlean-public.crate" | cut -d' ' -f1)"
              test "$actual" = "$expected"
              exit 0
            fi
            sleep 2
          done
          echo "::error::lexlean ${VERSION} did not become publicly downloadable" >&2
          exit 1
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.identity.outputs.image }}
          VERSION: ${{ needs.identity.outputs.version }}
          DIGEST: ${{ needs.manifest.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          semantics="$(paste -sd ',' release/compiler-semantics-id.txt)"
          {
            echo "## lexlean ${VERSION}"
            echo
            echo '```text'
            cat release/version-output.txt
            echo '```'
            echo
            echo "Container image (GitHub Packages):"
            echo
            echo '```text'
            echo "docker pull ${IMAGE}:${VERSION}@${DIGEST}"
            echo '```'
            echo
            echo "The image carries the compiler and \`leanprover/lean4:v$(sed 's|.*:v||' lean-toolchain)\`, so \`lexlean verify\` runs in it."
            echo
            echo "\`lexlean-${VERSION}-binaries.tar.gz\` holds one binary per supported"
            echo "host (SPEC.md §8.3) under \`bin/<target>/\`."
            echo
            echo "\`checksums.txt\` covers every attached file *and* each binary inside the"
            echo "tarball, so verify after extracting it:"
            echo
            echo '```text'
            echo "tar -xzf lexlean-${VERSION}-binaries.tar.gz"
            echo "sha256sum -c checksums.txt"
            echo '```'
            echo
            echo "The digests:"
            echo
            echo '```text'
            cat release/checksums.txt
            echo '```'
            echo
            echo "\`release-check.txt\` records what SPEC.md §30 refuses at this version."
            echo "§2.3 names the completion release, the first release satisfying the"
            echo "complete specification; a tag before it does not claim that criterion,"
            echo "and the report names each part of it that does not hold. See CHANGELOG.md."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "lexlean ${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            release/checksums.txt \
            release/release-identity.json \
            release/MANIFEST.sha256 \
            release/lexlean.crate \
            release/sbom.json \
            release/vv-evidence.txt \
            release/release-check.txt \
            release/version-output.txt \
            release/compiler-semantics-id.txt \
            release/CONFORMANCE.md \
            release/ERRORS.md \
            release/SPEC.md \
            release/LICENSE-APACHE \
            release/LICENSE-MIT \
            "release/lexlean-${VERSION}-binaries.tar.gz"
          echo "published ${GITHUB_REF_NAME} (compiler-semantics ${semantics})"
