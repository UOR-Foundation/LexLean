# The tag of a cut (SPEC.md §9.4): a push to a release line whose first
# parent carried another workspace version is the merge of a cut (`cut.yml`).
# Once `ci.yml` has passed on that push, this tags it `vX.Y.Z`, dispatches
# `release.yml` on the tag (a tag pushed with the workflow token starts no
# run), and opens the pull request that carries the line to `main`, which
# receives a line at its tag. Any other push ends at the first step.
#
# A gate that fails leaves the commit untagged; tag it by hand once a rerun
# passes (`git tag -a vX.Y.Z -m "LexLean vX.Y.Z" && git push origin vX.Y.Z`),
# which starts `release.yml` itself.
name: tag

on:
  push:
    branches: ["release/**"]

permissions:
  contents: read

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag a cut
    if: github.repository == 'UOR-Foundation/LexLean'
    runs-on: ubuntu-24.04
    # The gate of a push that does not merge a verified tree runs for hours.
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Is this push a cut
        id: cut
        shell: bash
        run: |
          set -euo pipefail
          version_of() { git show "$1:Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1; }
          version=$(version_of HEAD)
          previous=$(version_of HEAD^1 2>/dev/null || true)
          if [ "$version" = "$previous" ]; then
            echo "the workspace version is $version on both sides: not a cut"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged"
            exit 0
          fi
          if ! grep -qxF "## $version" CHANGELOG.md; then
            echo "::error::the version moved to $version, and CHANGELOG.md has no \`## $version\` entry"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Wait for the gate of this push
        if: steps.cut.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 340); do
            state=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.html_url)"' 2>/dev/null || true)
            case "$state" in
              "completed success "*) echo "gate passed: ${state##* }"; exit 0 ;;
              completed*) echo "::error::the gate of $GITHUB_SHA did not pass: $state"; exit 1 ;;
            esac
            sleep 60
          done
          echo "::error::the gate of $GITHUB_SHA did not finish in time"
          exit 1
      - name: Tag, release, and carry the line to main
        if: steps.cut.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "v$VERSION" -m "LexLean v$VERSION"
          git push origin "refs/tags/v$VERSION"
          gh workflow run release.yml --repo "$REPO" --ref "v$VERSION"
          echo "Tagged v$VERSION at $GITHUB_SHA and dispatched release.yml" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(gh pr list --repo "$REPO" --base main --head "$GITHUB_REF_NAME" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "$REPO" --base main --head "$GITHUB_REF_NAME" \
              --title "Land v$VERSION on main" \
              --body "\`main\` receives \`$GITHUB_REF_NAME\` at its tag \`v$VERSION\` (SPEC.md §9.4; opened by \`tag.yml\`)." \
              || echo "::warning::no pull request into main opened"
          fi
