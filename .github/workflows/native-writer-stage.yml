      - name: Capture terminal or interrupted state independently
        if: always()
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          # No output capture while any registered child may still be running.
          if [[ -f "$RUNNER_TEMP/lexlean-containment.py" ]]; then
            python3 "$RUNNER_TEMP/lexlean-containment.py" cleanup
          fi
          python3 - <<'PY'
          import os, pathlib as P, subprocess as S, json, time, tarfile
          e=P.Path('evidence'); w=P.Path(os.environ['RUNNER_TEMP'])/'work'
          receipt=e/'receipt.json'
          try: r=json.loads(receipt.read_text())
          except (OSError,ValueError): r={'status':'interrupted','reason':'no valid producer receipt'}
          if r.get('status') not in ('passed','failed','interrupted'):
              r.update(status='interrupted',reason='producer has no terminal outcome')
          try: supervisor=json.loads((e/'supervisor.json').read_text())
          except (OSError,ValueError): supervisor={}
          accepted=r.get('status')=='passed' and supervisor.get('supervisor_exit')==0
          if r.get('status')=='passed' and not accepted:
              r.update(status='interrupted',reason='success not confirmed by supervisor')
          (e/'capture-status.json').write_text(json.dumps({'observed_epoch':time.time(),'producer_receipt':r,'supervisor':supervisor,'accepted':accepted})+'\n')
          def capture(name,argv):
              with (e/name).open('wb') as f:
                  try:
                      p=S.run(argv,cwd=w if w.exists() else None,stdout=f,stderr=S.STDOUT,timeout=60)
                      return p.returncode
                  except Exception as err: f.write(repr(err).encode()); return -1
          capture('capture-processes.txt',['ps','-eo','pid,ppid,stat,etimes,rss,vsz,comm'])
          capture('capture-memory.txt',['free','-b'])
          capture('capture-swap.txt',['swapon','--show','--bytes'])
          capture('capture-disk.txt',['df','-B1'])
          cg=P.Path('/sys/fs/cgroup'); membership=P.Path('/proc/self/cgroup').read_text()
          rel=next((x.split(':',2)[2] for x in membership.splitlines() if x.startswith('0::')), '/')
          nested=cg/rel.lstrip('/'); cg=nested if (nested/'memory.max').exists() else cg
          (e/'capture-cgroup.json').write_text(json.dumps({'path':str(cg),'membership':membership,
            'values':{n:(cg/n).read_text() for n in ['memory.max','memory.high','memory.current','memory.peak','memory.events','memory.swap.max','memory.swap.current'] if (cg/n).exists()}}))
          if w.exists():
              capture('capture-git-status.txt',['git','status','--porcelain=v1'])
              capture('capture-partial.patch',['git','diff','--binary','HEAD'])
              try:
                  tracked=S.check_output(['git','diff','--name-only','-z','HEAD'],cwd=w).split(b'\0')
                  untracked=S.check_output(['git','ls-files','--others','--exclude-standard','-z'],cwd=w).split(b'\0')
