[package]
name = "repo-conformance"
description = "The BDD runner and the honesty meta-gate. Dev and CI only; never a dependency of a shipped crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
camino = { workspace = true }
lexlean = { workspace = true }
repo-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

# A timeout ends the process group of the oracle's tools (`lake` starts
# `lean`, `cargo` starts `rustc`); `rustix` signals a group without unsafe
# code and without a `kill` executable. `signal-hook` is the CL-22 host's own
# handling of SIGINT and SIGTERM, beside which the library must install none.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }
signal-hook = { workspace = true }

[lints]
workspace = true
