# One-time regeneration for the equation-of-a-conditional law (PF-26) on the
# release line. The laws module is committed (exported once with the #117
# oracle; the runtime modules it imports are the same on this line). This
# carries the language-1.2 identity to the new one in every lock, provenance
# record and manifest, runs the writers, and commits what they write. The
# commit after it removes this workflow.
# Never lock a project under language/ or compiler/proofs: a lock there is a
# file of the embedded tree and moves the identity it records. Prose (*.md)
# keeps the identities it cites: the changelog records past releases' IDs.
name: regenerate-ite-law

on:
  push:
    branches: [claude/project-thread-zgkrpx]

permissions:
  contents: write

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[regenerate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: just
      - name: Install elan and the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Carry the language-1.2 identity to the new one
        shell: bash
        run: |
          set -euo pipefail
          old=$(sed -n 's/^compiler_semantics = "\([0-9a-f]*\)"/\1/p' bootstrap/lexlean.lock)
          cargo build -q -p lexlean --bin lexlean
          (cd bootstrap && "$GITHUB_WORKSPACE/target/debug/lexlean" lock > /dev/null)
          new=$(sed -n 's/^compiler_semantics = "\([0-9a-f]*\)"/\1/p' bootstrap/lexlean.lock)
          echo "language-1.2 identity $old -> $new"
          if [ "$old" != "$new" ]; then
            { git grep -lz "$old" -- . ':!.github' ':!*.md' || true; } | xargs -0 -r sed -i "s/$old/$new/g"
          fi
          git status --short | wc -l
      - name: Run the writers
        shell: bash
        run: |
          set +e
          failed=0
          for recipe in model-write golden-write fixtures-write calculus-write production-export-write; do
            echo "::group::$recipe"
            just "$recipe" > "$RUNNER_TEMP/$recipe.txt" 2>&1
            code=$?
            tail -60 "$RUNNER_TEMP/$recipe.txt"
            echo "exit $code"
            echo "$recipe $code" >> "$RUNNER_TEMP/exits.txt"
            echo "::endgroup::"
            [ "$code" -eq 0 ] || failed=1
          done
          git status --short | wc -l
          # A writer that failed fails the step, so its partial products are
          # never committed.
          exit $failed
      - name: Write the verification records of every example the change reaches
        # uor-atlas is language 1.0, which this change does not touch.
        shell: bash
        env:
          LEXLEAN_EXAMPLES_PART: without:uor-atlas
        run: |
          set +e
          just verify-write > "$RUNNER_TEMP/verify-write.txt" 2>&1
          code=$?
          grep -E "verify-examples|LLV|error|gate failed" "$RUNNER_TEMP/verify-write.txt" | tail -80
          echo "exit $code"
          echo "verify-write $code" >> "$RUNNER_TEMP/exits.txt"
          git status --short | wc -l
          exit $code
      - name: Keep the writers' logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: writers-logs
          path: ${{ runner.temp }}/*.txt
      - name: Check the identity did not move
        shell: bash
        run: |
          set -euo pipefail
          cargo build -q -p lexlean --bin lexlean
          before=$(sed -n 's/^compiler_semantics = "\([0-9a-f]*\)"/\1/p' bootstrap/lexlean.lock)
          (cd bootstrap && "$GITHUB_WORKSPACE/target/debug/lexlean" lock > /dev/null)
          after=$(sed -n 's/^compiler_semantics = "\([0-9a-f]*\)"/\1/p' bootstrap/lexlean.lock)
          echo "before $before after $after"
          test "$before" = "$after"
          git status --short -- language schemas tests/golden
      - name: Commit what the writers wrote
        # Only after every writer, verify-write and the identity check passed.
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/exits.txt"
          test "$(awk '$2 != 0' "$RUNNER_TEMP/exits.txt" | wc -l)" -eq 0
          test "$(wc -l < "$RUNNER_TEMP/exits.txt")" -eq 6
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- target || true
          git commit -q -m "chore(PF-26): regenerate the writers' outputs for the new language-1.2 identity" || { echo nothing to commit; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}"
