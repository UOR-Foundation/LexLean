# The normative acceptance gate (SPEC.md §9.4) and the supported-host gate
# (§8.3).
#
# `just vv` is the single gate, run from a clean checkout on Linux x86-64 with
# the exact pinned toolchains and no build cache: §9.4 says "from a clean
# checkout", and a restored target directory is not one. CI runs its twelve
# recipes as two legs at once, each its own clean checkout: `examples`, whose
# native Atlas verification is most of the gate's time, and the other eleven in
# the order of `vv`. Together they run every recipe of `vv` exactly once, so the
# gate is the same and the wall time is the longer leg rather than the sum.
# `honesty` is split out so a claim that has drifted from its evidence reads
# differently from broken code.
#
# The gate runs on the standard GitHub-hosted runner at the verifier's default
# width of 1 (SPEC.md §9.4, §22.11); no larger runner and no wider width is part
# of it. What the run cost, by recipe, stage, and module, is written to
# `ci-evidence/` (§22.12) and uploaded with the log.
#
# Every version this file needs is read from the file that pins it —
# `rust-toolchain.toml` through `rustup toolchain install`, `lean-toolchain`
# through `elan toolchain install` — so the workflow cannot drift from the
# repository's own pins. Third-party actions are pinned by commit, with the
# release they belong to named alongside: a floating tag is a dependency
# whose contents may change after review, which R6 does not allow for the
# code in the crate and should not allow for the code that gates it.
name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      maintenance:
        description: Explicit devcontainer maintenance; not ordinary CI acceptance
        type: choice
        default: none
        options: [none, regenerate, verify-devcontainer]

# Read-only: nothing in this workflow writes to the repository or publishes a
# package. The acceptance log is retained as CI evidence; `release.yml` asks
# separately for the artifacts it owns.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A clean job still compiles several test profiles before Atlas. Disabling
  # Cargo's per-crate incremental cache leaves runner disk for proof evidence
  # and for the bounded swap file used by Lean's largest environments.
  CARGO_INCREMENTAL: "0"

jobs:
  vv:
    name: just vv (${{ matrix.part }})
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.maintenance != 'regenerate' && inputs.maintenance != 'verify-devcontainer') }}
    # A failing leg does not cancel the other: each leg's evidence is complete.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: examples, recipes: "examples" }
          - { part: rest, recipes: "fmt-check model spec-links lint test features bdd inventory golden repro deny" }
    runs-on: ubuntu-24.04
    # Native Atlas elaboration, per-module kernel replay, and per-module axiom
    # audit are intentionally the long pole. GitHub-hosted jobs permit six
    # hours; a shorter local-style timeout would turn complete proof coverage
    # into a CI failure mode.
    timeout-minutes: 360
    env:
      # Operational only (SPEC.md §22.12): no artifact records it, and the
      # telemetry directory is CI evidence, uploaded below.
      LEXLEAN_CI_TELEMETRY: ${{ github.workspace }}/ci-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: just,cargo-deny
      - name: Install elan and the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Reserve bounded overflow memory for native Atlas
        run: |
          set -euo pipefail
          sudo fallocate -l 4G "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo chmod 600 "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo mkswap "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo swapon "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo sysctl vm.swappiness=10
          swapon --show
      - name: Run the normative acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          monitor_resources() {
            while true; do
              date -u +'%Y-%m-%dT%H:%M:%SZ'
              free -m
              df -h "$RUNNER_TEMP"
              sleep 60
            done
          }
          # One row every five seconds: time, free memory, swap in use, and the
          # largest resident set, so that the memory of each recipe is read
          # from the run itself (`cargo xtask ci-summary`).
          sample_resources() {
            set +e
            while true; do
              avail=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
              swap=$(awk '/^SwapTotal:/ {t=$2} /^SwapFree:/ {f=$2} END {print t-f}' /proc/meminfo)
              top=$( (ps -eo rss= --sort=-rss || true) | awk 'NR==1 {print $1}')
              printf '%s\t%s\t%s\t%s\n' "$(date +%s.%N | cut -c1-14)" "$avail" "$swap" "${top:-0}"
              sleep 5
            done
          }
          monitor_resources > >(tee ci-evidence/resources.txt) &
          monitor_pid=$!
          sample_resources > ci-evidence/resources.tsv &
          sample_pid=$!
          trap 'kill "$monitor_pid" "$sample_pid" 2>/dev/null || true; wait "$monitor_pid" "$sample_pid" 2>/dev/null || true' EXIT
          just --timestamp --timestamp-format '%s%.3f' ${{ matrix.recipes }} 2>&1 | tee ci-evidence/vv.txt
          # The end of the leg's last recipe, as `vv` prints its own at the end
          # of the whole gate (`repo_conformance::evidence::PART_PASSED_LINE`).
          printf '[%s] %s\n' "$(date +%s.%3N)" 'vv part: every recipe passed' >> ci-evidence/vv.txt
      # What the run cost, by recipe, stage, and module (SPEC.md §9.4). Evidence
      # only: it is read by people and by later measurements, never by a recipe.
      # It prints the summary to this log and appends it to the step summary, as
      # well as keeping `summary.md`, because an uploaded artifact cannot be read
      # from the log; it runs when the gate failed, for the same reason.
      - name: Summarize the run's timing and memory
        if: ${{ !cancelled() }}
        run: cargo xtask ci-summary --evidence ci-evidence
      # The example gate discovers Atlas rather than receiving an allow-list.
      # These assertions make its complete proof run visible as first-class CI
      # evidence without running the expensive verifier a second time.
      # The leg that runs `examples` is chosen by the matrix, not by the log,
      # so a leg that should have verified Atlas and did not fails here.
      - name: Assert native Atlas was verified by the acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          case " ${{ matrix.recipes }} " in
            *" examples "*)
              grep -F "verify-examples: uor-atlas verified (attestation " ci-evidence/vv.txt
              grep -F "verify-examples: uor-atlas: 267 normalized verification records equal expected/verify (§29.5)" ci-evidence/vv.txt
              ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: acceptance-gate-evidence-${{ matrix.part }}
          path: ci-evidence
          if-no-files-found: error
          retention-days: 14

  # §8.3: the crate builds and its non-Lean tests pass on every supported
  # host. This job installs no Lean toolchain on purpose — that is the
  # property under test. A case whose assertions need the pinned toolchain
  # goes through `repo_conformance::support::lean_backed`, which on a
  # non-normative host runs the case's platform-independent assertions and
  # reports which ones it skipped; on Linux x86-64 the same gate makes the
  # toolchain mandatory, so nothing passes vacuously where it matters.
  #
  # There is no separate build step: `cargo test` with the same `--locked
  # --workspace --all-features` builds, in the same profile, the library and the
  # binary of `lexlean` (its integration tests run the binary) before it runs a
  # test, so a crate that does not build fails this job at the same step. A
  # separate build step added only the non-test compilation of the repository's
  # own `xtask` and `repo-conformance`, which no host in this job runs.
  host-matrix:
    name: build and non-Lean tests (${{ matrix.target }})
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.maintenance != 'regenerate' && inputs.maintenance != 'verify-devcontainer') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # The image label and the host triple are separate facts. A runner
      # image that changed architecture underneath the label would otherwise
      # leave one of the five §8.3 hosts silently untested.
      - name: The runner is the host this leg claims
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::${{ matrix.os }} is $host, not ${{ matrix.target }} (SPEC.md §8.3)"
            exit 1
          fi
          echo "$host"
      # `--no-fail-fast`: cargo otherwise stops at the first test binary that
      # fails, so a host with two independent failures reports one, and each
      # further one costs a whole run of the leg. The job fails exactly when a
      # test fails, as before; only what it reports is complete (SPEC.md §8.3).
      - run: cargo test --locked --workspace --all-features --no-fail-fast
  devcontainer-maintenance:
    name: devcontainer maintenance (${{ inputs.maintenance }})
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.maintenance == 'regenerate' || inputs.maintenance == 'verify-devcontainer') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MAINTENANCE_MODE: ${{ inputs.maintenance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the repository's pinned devcontainer
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p ci-evidence
          git rev-parse HEAD | tee ci-evidence/source-commit.txt
          git rev-parse HEAD^{tree} | tee ci-evidence/source-tree.txt
          docker build --iidfile ci-evidence/image-id.txt -f .devcontainer/Dockerfile . 2>&1 | tee ci-evidence/image-build.txt
          docker image inspect "$(cat ci-evidence/image-id.txt)" > ci-evidence/image-inspect.json
      - name: Capture the original fixture oracle boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          protected = (
              "lock-schema-language-mismatch", "lock-schema-language-mismatch-1.1",
              "model-artifact-source-under-1.1", "module-prefix-reserved",
              "module-prefix-shipped-root", "package-language-mismatch",
          )
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          cases = sorted(p for root in ("tests/fixtures", "tests/negative") for p in Path(root).rglob("case.toml"))
          assert cases
          before = {
              "cases": {str(p): digest(p) for p in cases},
              "codes": {str(p.parent / "expected/diagnostics.json"): [d["code"] for d in json.loads((p.parent / "expected/diagnostics.json").read_bytes())] for p in cases},
              "protected": {str(p): digest(p) for name in protected for p in (Path("tests/negative") / name / "project/lexlean.toml", Path("tests/negative") / name / "project/lexlean.lock")},
          }
          Path("ci-evidence/fixture-boundaries.json").write_text(json.dumps(before, sort_keys=True) + "\n")
          PY
      - name: Run the explicit maintenance operation as the devcontainer user
        shell: bash
        run: |
          set -euo pipefail
          case "$MAINTENANCE_MODE" in regenerate|verify-devcontainer) ;; *) exit 1 ;; esac
          source_dir="$RUNNER_TEMP/lexlean-maintenance-source"
          test ! -e "$source_dir"
          git clone --no-local --no-hardlinks "$GITHUB_WORKSPACE" "$source_dir"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$(cat ci-evidence/source-commit.txt)"
          sudo chown -R 1000:1000 "$source_dir"
          sudo fallocate -l 4G "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo chmod 600 "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo mkswap "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo swapon "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo sysctl vm.swappiness=10
          actor="lexlean-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          nonce="$(openssl rand -hex 16)"
          revision="$(cat ci-evidence/source-commit.txt)"
          image="$(cat ci-evidence/image-id.txt)"
          matches_inspection() {
            local target=$1 format=$2 expected=$3 observed
            observed="$(timeout 10 docker inspect --format "$format" "$target")" || return 1
            test "$observed" = "$expected"
          }
          retire_actor() {
            primary_status=$?
            trap - EXIT
            set +e
            result=$primary_status
            printf '%s\n' "$primary_status" > ci-evidence/maintenance-primary-exit.txt || result=1
            deadline=$((SECONDS + 60))
            while [ ! -s ci-evidence/container.cid ] && [ "$SECONDS" -lt "$deadline" ]; do
              sleep 0.25
            done
            if [ -f ci-evidence/container.cid ] && [ ! -L ci-evidence/container.cid ] && \
              [ "$(stat --format '%h' ci-evidence/container.cid)" = 1 ]; then
              cid="$(cat ci-evidence/container.cid)"
              if [[ ! "$cid" =~ ^[0-9a-f]{64}$ ]] || \
                ! matches_inspection "$cid" '{{.Name}}' "/$actor" || \
                ! matches_inspection "$cid" '{{.Config.Image}}' "$image" || \
                ! matches_inspection "$cid" '{{index .Config.Labels "lexlean.maintenance.nonce"}}' "$nonce" || \
                ! matches_inspection "$cid" '{{index .Config.Labels "lexlean.maintenance.revision"}}' "$revision"; then
                echo "Cannot authenticate maintenance container" >&2
                exit 1
              fi
              timeout 60 docker inspect "$cid" > ci-evidence/container-inspect.json || result=1
              timeout 60 docker stop --time 10 "$cid" > ci-evidence/container-stop.txt 2>&1 || result=1
              timeout 60 docker rm "$cid" > ci-evidence/container-remove.txt 2>&1 || result=1
              query_status=0
              timeout 60 docker ps --all --quiet --no-trunc --filter "id=$cid" > ci-evidence/remaining-id.stdout || query_status=$?
              printf '%s\n' "$query_status" > ci-evidence/remaining-id-exit.txt || result=1
              test "$query_status" -eq 0 && test ! -s ci-evidence/remaining-id.stdout || result=1
              query_status=0
              timeout 60 docker ps --all --quiet --no-trunc --filter "name=^/$actor$" > ci-evidence/remaining-name.stdout || query_status=$?
              printf '%s\n' "$query_status" > ci-evidence/remaining-name-exit.txt || result=1
              test "$query_status" -eq 0 && test ! -s ci-evidence/remaining-name.stdout || result=1
            else
              echo "Unresolved pending container identity; absence is not established" >&2
              result=1
            fi
            python3 - "$source_dir" <<'PY' || result=1
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          before = json.loads(Path("ci-evidence/fixture-boundaries.json").read_bytes())
          for relative, expected in {**before["cases"], **before["protected"]}.items():
              p = root / relative
              actual = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert actual == expected, f"Fixture input changed: {relative}"
          for relative, expected in before["codes"].items():
              actual = [d["code"] for d in json.loads((root / relative).read_bytes())]
              assert actual == expected, f"Intended oracle diagnostic changed: {relative}"
          print("Original case inputs, protected admission failures and all diagnostic-code arrays are unchanged")
          PY
            git -c safe.directory="$source_dir" -C "$source_dir" diff --binary > ci-evidence/generated.patch || result=1
            git -c safe.directory="$source_dir" -C "$source_dir" diff --stat > ci-evidence/generated-stat.txt || result=1
            sha256sum ci-evidence/generated.patch > ci-evidence/generated-patch.sha256 || result=1
            if ! printf '%s\n' "$result" > ci-evidence/maintenance-exit.txt; then
              exit 1
            fi
            exit "$result"
          }
          trap retire_actor EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          docker run --name "$actor" --cidfile ci-evidence/container.cid --init --user 1000:1000 \
            --label "lexlean.maintenance.nonce=$nonce" --label "lexlean.maintenance.revision=$revision" \
            --env CARGO_INCREMENTAL=0 --env CARGO_TERM_COLOR=never \
            --env MAINTENANCE_MODE --volume "$source_dir:/work" \
            --workdir /work \
            "$(cat ci-evidence/image-id.txt)" bash -euo pipefail -c '
              test "$(id -u)" = 1000
              rustc -vV
              cargo --version
              lean --version
              just --version
              cargo deny --version
              test -z "$(git status --porcelain)"
              if [ "$MAINTENANCE_MODE" = verify-devcontainer ]; then
                just vv
                test -z "$(git status --porcelain)"
              else
                cargo build --locked -p lexlean
                for project in examples/*/lexlean.toml compiler/lexlean.toml; do
                  target/debug/lexlean --project "$project" lock
                done
                just golden-write
                just calculus-write
                cargo build --locked -p lexlean
                for project in examples/*/lexlean.toml compiler/lexlean.toml; do
                  target/debug/lexlean --project "$project" lock
                done
                just golden-write
                # The second compiler build changes every Rust package source
                # identity. Refresh those through their owning writer without
                # permitting a further change to the embedded Lean modules.
                preservation_before=$(mktemp)
                preservation_after=$(mktemp)
                find language/preservation-1.2/modules -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$preservation_before"
                test -s "$preservation_before"
                just calculus-write
                find language/preservation-1.2/modules -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$preservation_after"
                cmp "$preservation_before" "$preservation_after"
                just calculus
                affected=0
                refreshed=0
                for project in tests/negative/*/project/lexlean.toml; do
                  if grep -Eq "^language = \"1\.[12]\"$" "$project"; then
                    affected=$((affected + 1))
                    case "$project" in
                      tests/negative/lock-schema-language-mismatch/project/lexlean.toml|tests/negative/lock-schema-language-mismatch-1.1/project/lexlean.toml|tests/negative/model-artifact-source-under-1.1/project/lexlean.toml|tests/negative/module-prefix-reserved/project/lexlean.toml|tests/negative/module-prefix-shipped-root/project/lexlean.toml|tests/negative/package-language-mismatch/project/lexlean.toml) continue ;;
                    esac
                    target/debug/lexlean --project "$project" lock
                    refreshed=$((refreshed + 1))
                  fi
                done
                test "$affected" = 232
                test "$refreshed" = 226
                just fixtures-write
                just verify-write
                just fixtures golden
                git diff --check
                git add --intent-to-add -- examples compiler language/preservation-1.2/modules tests/fixtures tests/negative
                test -z "$(git ls-files --others --exclude-standard)"
              fi
            ' 2>&1 | tee ci-evidence/maintenance.txt
          matches_inspection "$actor" '{{.State.ExitCode}}' 0
          matches_inspection "$actor" '{{.State.OOMKilled}}' false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: devcontainer-maintenance-evidence
          path: ci-evidence
          if-no-files-found: error
          retention-days: 14
