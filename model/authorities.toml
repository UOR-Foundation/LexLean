vendored = "model/authorities/UOR-GNAF-v1-draft.2.md"
statement = "UOR-GNAF requires an optimality claim to fix its machine contract, accounting model, complete-system universe with completeness evidence independent of discovery and of any optimizer, objective order, and claim class before optimization; it requires dispatch, preparation, and every other in-boundary action to be accounted, unknown costs to leave candidates in the universe, and an internal plan or a pointwise envelope not to be reported as a complete system's optimum; it requires an instantiation to publish a dependency manifest; and it states the normative fixtures of its section 16."
