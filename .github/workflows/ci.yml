# The normative acceptance gate (SPEC.md §9.4) and the supported-host gate
# (§8.3).
#
# `just vv` is the single gate, run from a clean checkout on Linux x86-64 with
# the exact pinned toolchains and no build cache: §9.4 says "from a clean
# checkout", and a restored target directory is not one. `honesty` is split
# out so a claim that has drifted from its evidence reads differently from
# broken code.
#
# Every version this file needs is read from the file that pins it —
# `rust-toolchain.toml` through `rustup toolchain install`, `lean-toolchain`
# through `elan toolchain install` — so the workflow cannot drift from the
# repository's own pins. Third-party actions are pinned by commit, with the
# release they belong to named alongside: a floating tag is a dependency
# whose contents may change after review, which R6 does not allow for the
# code in the crate and should not allow for the code that gates it.
name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Read-only: nothing in this workflow writes to the repository or publishes a
# package. The acceptance log is retained as CI evidence; `release.yml` asks
# separately for the artifacts it owns.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A clean job still compiles several test profiles before Atlas. Disabling
  # Cargo's per-crate incremental cache leaves runner disk for proof evidence
  # and for the bounded swap file used by Lean's largest environments.
  CARGO_INCREMENTAL: "0"

jobs:
  vv:
    name: just vv
    runs-on: ubuntu-24.04
    # Native Atlas elaboration, per-module kernel replay, and per-module axiom
    # audit are intentionally the long pole. GitHub-hosted jobs permit six
    # hours; a shorter local-style timeout would turn complete proof coverage
    # into a CI failure mode.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: just,cargo-deny
      - name: Install elan and the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Reserve bounded overflow memory for native Atlas
        run: |
          set -euo pipefail
          sudo fallocate -l 4G "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo chmod 600 "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo mkswap "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo swapon "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo sysctl vm.swappiness=10
          swapon --show
      - name: Run the normative acceptance gate
        shell: bash
        env:
          # Noncanonical performance telemetry (SPEC.md §22.11, VR-21): the
          # verifier appends one row per child process here. It is CI evidence
          # only — never read back, never hashed into any artifact or identity.
          # Set at step level, not job level: `runner` is not among the
          # contexts GitHub allows in `jobs.<job_id>.env`.
          LEXLEAN_VERIFY_TELEMETRY: ${{ runner.temp }}/lexlean-telemetry.jsonl
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          # Host-side samples for the CI-only memory telemetry: host memory and
          # swap from /proc/meminfo, and the resident set of the proof
          # processes (lean, leanchecker). Five-second sampling is enough to
          # see the peaks without flooding the log.
          monitor_resources() {
            while true; do
              ts=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
              mem=$(awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} /SwapTotal/{st=$2} /SwapFree/{sf=$2} END{printf "mem_total_kb=%s mem_available_kb=%s swap_total_kb=%s swap_used_kb=%s", t, a, st, st-sf}' /proc/meminfo)
              rss=$(ps -eo rss=,comm= | awk '$2=="lean"||$2=="leanchecker"{s+=$1} END{print s+0}')
              echo "$ts $mem proof_rss_kb=$rss"
              sleep 5
            done
          }
          monitor_resources > ci-evidence/resources.txt 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          # `--timestamp` runs exactly the recipes `just vv` runs, stamping each
          # command with its start time so per-recipe wall time is recoverable.
          just --timestamp --timestamp-format '%Y-%m-%dT%H:%M:%S' vv 2>&1 | tee ci-evidence/vv.txt
      # CI-only performance evidence, aggregated from the telemetry file, the
      # resource samples, and the per-recipe timestamps (SPEC.md §9.4, §22.11).
      # It never fails the gate: a missing or unreadable sample is reported as
      # absent, never as a semantic result.
      - name: Summarize performance evidence
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LEXLEAN_VERIFY_TELEMETRY: ${{ runner.temp }}/lexlean-telemetry.jsonl
        run: |
          set -uo pipefail
          python3 - <<'PY' || true
          import json, os, re, pathlib
          from datetime import datetime

          ev = pathlib.Path("ci-evidence")
          evidence = {"runner": os.environ.get("RUNNER_NAME", ""), "commit": os.environ.get("GITHUB_SHA", "")}

          # Per-recipe wall time from the `just --timestamp` lines.
          stamp = re.compile(r"^\[(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)\] (.+)$")
          seen = []
          vv = ev / "vv.txt"
          if vv.exists():
              for line in vv.read_text(errors="replace").splitlines():
                  m = stamp.match(line)
                  if m:
                      seen.append((m.group(1), m.group(2)))
          def seconds(a, b):
              return int((datetime.strptime(b, "%Y-%m-%dT%H:%M:%S") - datetime.strptime(a, "%Y-%m-%dT%H:%M:%S")).total_seconds())
          evidence["recipes"] = [
              {"command": cmd, "start": ts, "wall_s": (seconds(ts, seen[i + 1][0]) if i + 1 < len(seen) else None)}
              for i, (ts, cmd) in enumerate(seen)
          ]

          # Verification telemetry: per-stage totals and the slowest modules.
          stages, modules = {}, []
          tel = os.environ.get("LEXLEAN_VERIFY_TELEMETRY", "")
          if tel and pathlib.Path(tel).exists():
              for line in pathlib.Path(tel).read_text(errors="replace").splitlines():
                  if not line.strip():
                      continue
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  stage = row.get("stage", "?")
                  wall = int(row.get("wall_ms", 0))
                  agg = stages.setdefault(stage, {"count": 0, "total_ms": 0, "max_ms": 0})
                  agg["count"] += 1
                  agg["total_ms"] += wall
                  agg["max_ms"] = max(agg["max_ms"], wall)
                  if row.get("kind") is None and row.get("module"):
                      modules.append((wall, row["module"], stage))
          modules.sort(reverse=True)
          evidence["verification"] = {
              "stages": stages,
              "slowest_children": [{"module": m, "stage": s, "wall_ms": w} for w, m, s in modules[:20]],
          }

          # Host memory peaks from the resource samples.
          memory = {"samples": 0, "min_mem_available_kb": None, "max_swap_used_kb": 0, "max_proof_rss_kb": 0}
          resources = ev / "resources.txt"
          if resources.exists():
              for line in resources.read_text(errors="replace").splitlines():
                  kv = dict(re.findall(r"(\w+)=(\d+)", line))
                  if not kv:
                      continue
                  memory["samples"] += 1
                  available = int(kv.get("mem_available_kb", 0))
                  memory["min_mem_available_kb"] = available if memory["min_mem_available_kb"] is None else min(memory["min_mem_available_kb"], available)
                  memory["max_swap_used_kb"] = max(memory["max_swap_used_kb"], int(kv.get("swap_used_kb", 0)))
                  memory["max_proof_rss_kb"] = max(memory["max_proof_rss_kb"], int(kv.get("proof_rss_kb", 0)))
          evidence["memory"] = memory

          (ev / "performance.json").write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          print("ci-evidence/performance.json:")
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          test -s ci-evidence/performance.json || echo "performance evidence unavailable" > ci-evidence/performance.json
      # The example gate discovers Atlas rather than receiving an allow-list.
      # These assertions make its complete proof run visible as first-class CI
      # evidence without running the expensive verifier a second time.
      - name: Assert native Atlas was verified by the acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F "verify-examples: uor-atlas verified (attestation " ci-evidence/vv.txt
          grep -F "verify-examples: uor-atlas: 267 normalized verification records equal expected/verify (§29.5)" ci-evidence/vv.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: acceptance-gate-evidence
          path: ci-evidence
          if-no-files-found: error
          retention-days: 14

  # §8.3: the crate builds and its non-Lean tests pass on every supported
  # host. This job installs no Lean toolchain on purpose — that is the
  # property under test. A case whose assertions need the pinned toolchain
  # goes through `repo_conformance::support::lean_backed`, which on a
  # non-normative host runs the case's platform-independent assertions and
  # reports which ones it skipped; on Linux x86-64 the same gate makes the
  # toolchain mandatory, so nothing passes vacuously where it matters.
  host-matrix:
    name: build and non-Lean tests (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # The image label and the host triple are separate facts. A runner
      # image that changed architecture underneath the label would otherwise
      # leave one of the five §8.3 hosts silently untested.
      - name: The runner is the host this leg claims
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::${{ matrix.os }} is $host, not ${{ matrix.target }} (SPEC.md §8.3)"
            exit 1
          fi
          echo "$host"
      # `cargo test` compiles the library, the binaries, and every test target,
      # so a separate `cargo build` of the same profile is redundant: the §8.3
      # property "builds and non-Lean tests pass" is established by the test
      # run alone.
      - run: cargo test --locked --workspace --all-features
