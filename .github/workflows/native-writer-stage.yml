                      for raw in sorted(set(tracked+untracked)-{b''}):
                          name=os.fsdecode(raw); path=w/name
                          if path.exists() or path.is_symlink(): archive.add(path,arcname=name,recursive=False)
              except Exception as err: (e/'capture-error.txt').write_text(repr(err))
          raise SystemExit(0 if accepted else 1)
