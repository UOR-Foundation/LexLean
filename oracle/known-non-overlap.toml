probe = "OracleProbe.ProbeFunctionRef.referenceRoot"
refusal = "opaque-lowering"
scope = "construct"
reason = "A function-typed parameter reaches the oracle as a type expression it has no rendering for (opaque lowering); LexLean defunctionalizes closures (§17.14)."

[[construct]]
key = "type.reasoning_failure"
kind = "oracle-refuses"
probe = "Reasoning.Main.gradeLevel"
refusal = "unresolved-external-call"
scope = "closure"
reason = "Only reasoner closures realize it, and the oracle refuses the reasoners as unresolved external calls: they iterate with definitions of the runtime module a generated module imports (§17.12), which the oracle's exporter does not follow; the probe is the smallest reasoner root of examples/reasoning, whose closure holds it among others."

