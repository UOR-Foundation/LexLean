name: Sedona Spine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Enforce Zero-Drift Toolchain
        run: |
          if ! grep -q '"fixedToolchain": true' lake-manifest.json; then
            echo "Error: lake-manifest.json must have fixedToolchain: true"
            exit 1
          fi
          TOOLCHAIN=$(cat lean-toolchain | tr -d '[:space:]')
          if [ "$TOOLCHAIN" != "leanprover/lean4:v4.32.1" ]; then
            echo "Error: lean-toolchain must pin to leanprover/lean4:v4.32.1"
            exit 1
          fi

      - name: Proof Debt Detection
        run: |
          if grep -r "sorry" lean/ | grep -v "test/"; then
            echo "Error: Found 'sorry' in Lean proofs!"
            exit 1
          fi

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Run UORC Mandatory Gates (Epic 17)
        run: |
          cd packages/compression-main
          just vv
