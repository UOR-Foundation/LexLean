# oracle/known-non-overlap.toml --- the constructs of the production registry
# (SPEC.md §17.13) that are outside the overlap of LexLean and the
# differential oracle (§17.19).
#
# Every construct of `language/production-1.2.toml` is realized by a corpus
# root the oracle accepts or is a row here, never neither. A row is
# re-asserted on every run: its probe must still realize the construct, the
# oracle must still refuse the probe for the stated kind, and no root the
# oracle accepts may realize the construct. A change to a row raises
# `version`, and the digest of the rows at each version is recorded in
# `oracle/table-versions.toml`, which fails the run when the rows and the
# version disagree.

spec = "lexlean/oracle-overlap/1"
version = 4

[[construct]]
key = "type.type"
kind = "not-runtime"
disposition = "formal-only"
reason = "A universe is never a runtime value, in LexLean (registry disposition formal-only) or in the oracle, which erases types and proofs; the corpus root `production-universe-boundary` shows both refusing a root that takes one."

[[construct]]
key = "type.parameter"
kind = "instantiated"
probe = "OracleProbe.ProbeGeneric.genericRoot"
refusal = "opaque-lowering"
scope = "construct"
reason = "The registry realizes a type parameter only by instantiating it at every use, so no root's closure holds it; the oracle has no monomorphization, and refuses the probe's generic definition instantiated at Nat (opaque lowering)."

[[construct]]
key = "type.prop"
kind = "not-runtime"
disposition = "formal-only"
reason = "A proposition is never a runtime value, in LexLean (formal-only) or in the oracle, which erases proofs and Props; the corpus roots `production-runtime-incompatible-type` and `production-named-type-boundary` show both refusing a root that returns or holds one."

[[construct]]
key = "type.int"
kind = "oracle-refuses"
probe = "OracleProbe.ProbeInt.intRoot"
refusal = "unresolved-external-call"
scope = "construct"
reason = "The oracle's subset has no mathematical integer: a Lean Int reaches the exporter as an unresolved call (Int.neg, ...), or a code generation refusal (UnboundedInt) when a fixed-width target is asked for. LexLean realizes the integer in 64 bits with explicit overflow (§17.13)."

