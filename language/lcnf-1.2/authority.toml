# The closed Lean compiler-front-end interface of named-root extraction
# (SPEC.md §22.10). Every constant the extraction adapter's own definitions
# use is exactly one row: a call (a function of Lean's `Lean` namespace),
# pinned by its exact signature at the pinned revision and the SHA-256 of the
# toolchain source file that defines it; a type of the `Lean` namespace,
# pinned by its complete constructor list; or plumbing (constructors,
# projections, recursors, instances, matchers, and core-library data whose
# meaning the calls and types fix). Lean's behavior is an external authority
# (LEAN-LCNF-4-32-1): these rows cite it, they do not prove it. Every
# extraction re-checks each call's signature structurally, binder kinds and
# default values included, each type's constructors, and that the adapter
# uses exactly these constants.

spec = "lexlean/lcnf-authority/2"
authority = "LEAN-LCNF-4-32-1"
lean_version = "4.32.1"
lean_githash = "f054605aea4b840552cca2e725580bffd1e1b704"

