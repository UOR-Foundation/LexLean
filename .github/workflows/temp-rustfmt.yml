name: Temporary canonical rustfmt repair
on:
  push:
    branches: [fix/restore-declared-license-assets]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Canonicalize Rust sources
        run: cargo fmt --all
      - name: Commit only rustfmt output
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '*.rs' '**/*.rs'
          test -z "$(git diff --name-only)"
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:fix/restore-declared-license-assets
