# TEMPORARY: regenerate PR 452 (BS-27) on a runner, because the local disk cannot hold the run.
# Runs on a push to the BS-27 branch. Download the `regenerated-tree` artifact, apply it to the
# branch, and delete this file in the same commit. It publishes nothing and writes nothing to the
# repository: `contents: read`, like `ci.yml`. Precedent: regen-forward-merge.yml (2026-10-27).
name: regen 452

on:
  push:
    branches: [claude/issue-269-surface-tooling]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regen-452
  cancel-in-progress: true

jobs:
  regen:
    name: regenerate on a clean checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free runner disk
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchains
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          . "$HOME/.elan/env"
          elan toolchain install "$(cat lean-toolchain)" || true
          rustc --version; lean --version || true
      - name: Regenerate (the steps of the local regeneration script, at the CI width)
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          export CARGO_INCREMENTAL=0 LEXLEAN_VERIFY_WIDTH=2
          step() { echo "::group::$1"; date -u +%FT%TZ; }
          step build
          cargo build -q -p lexlean -p xtask
          L=$PWD/target/debug/lexlean
          # The shell runs with -e: the first failing writer stops the step, and the capture still runs.
          for p in bootstrap stdlib; do (cd "$p" && "$L" lock); done
          echo "::endgroup::"
          step "production export"
          s=$(date +%s); cargo xtask check-production-export --write; echo "export in $(( $(date +%s)-s )) s"
          echo "::endgroup::"
          step "build oracles"
          cargo xtask check-golden --write
          echo "::endgroup::"
          step "verify records (without uor-atlas)"
          s=$(date +%s); LEXLEAN_EXAMPLES_PART=without:uor-atlas cargo xtask verify-examples --write; echo "verify in $(( $(date +%s)-s )) s"
          echo "::endgroup::"
          df -h /
      - name: Capture what the writers wrote
        if: always()
        shell: bash
        run: |
          git add -A -- . ':!target'
          git diff --cached --binary > regen.patch
          git diff --cached --name-only > regen-files.txt
          wc -l regen-files.txt
          du -h regen.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: regenerated-tree
          path: |
            regen.patch
            regen-files.txt
          retention-days: 5
