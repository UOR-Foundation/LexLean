name: Isolated native writer stage
on:
  workflow_call:
    inputs:
      stage: {type: string, required: true}
      export-sha256: {type: string, default: ''}
      export-tree: {type: string, default: ''}
    outputs:
      patch-sha256:
        value: ${{ jobs.writer.outputs.patch-sha256 }}
      product-tree:
        value: ${{ jobs.writer.outputs.product-tree }}
permissions:
  contents: read
jobs:
  writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      patch-sha256: ${{ steps.run.outputs.patch-sha256 }}
      product-tree: ${{ steps.run.outputs.product-tree }}
    env:
      INPUT: 9fd01c31e40bb29577833825f902fafcceedb49a
      TREE: ec744df3893e9648e6599c59fd27435bcc2f4877
      STAGE: ${{ inputs.stage }}
      EXPORT_SHA256: ${{ inputs.export-sha256 }}
      EXPORT_TREE: ${{ inputs.export-tree }}
      CARRIER: ${{ github.workflow_sha }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
      RUST_TEST_THREADS: '1'
      LEXLEAN_VERIFY_WIDTH: '1'
      LEXLEAN_CI_TELEMETRY: ${{ github.workspace }}/evidence/telemetry
    steps:
      - name: Reserve execution and capture deadlines
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_TARGET_DIR=%s/target\nTMPDIR=%s/scratch\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p evidence
          deadline=$(( $(date +%s) + 330 * 60 ))
          echo "PRODUCER_DEADLINE=$deadline" >> "$GITHUB_ENV"
          printf '{"job_minutes":360,"producer_minutes_from_first_step":330,"kill_grace_seconds":30,"capture_step_minutes":10,"deadline_epoch":%s}\n' "$deadline" > evidence/deadlines.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9fd01c31e40bb29577833825f902fafcceedb49a
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Bind isolated producer input
        run: |
          set -euo pipefail
          mkdir -p evidence "$TMPDIR"
          test "$(git -C source rev-parse HEAD)" = "$INPUT"
          test "$(git -C source rev-parse HEAD^{tree})" = "$TREE"
          test -z "$(git -C source status --porcelain)"
          git -C source worktree add --detach "$RUNNER_TEMP/work" "$INPUT"
      - name: Verify isolated child controls before expensive work
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/lexlean-containment.py" <<'CONTAINMENT'
          """Carrier-only helper; installed outside the pinned producer worktree."""
          import json, math, os, pathlib as P, selectors, shutil, signal, subprocess as S, sys, time
          
          ROOT = P.Path('/sys/fs/cgroup')
          TEMP = P.Path(os.environ['RUNNER_TEMP'])
          E = P.Path(os.environ['GITHUB_WORKSPACE']) / 'evidence'
          STATE = TEMP / 'lexlean-containment'
          GIB = 1024**3
          KEYS = ('memory.max', 'memory.high', 'memory.current', 'memory.peak',
                  'memory.events', 'memory.swap.max', 'memory.swap.current',
                  'memory.oom.group', 'cpu.max', 'cpu.stat', 'cgroup.events')
          
          
          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + '.tmp')
              tmp.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
              tmp.replace(path)
          
          
          def command(argv, check=True, timeout=40):
              return S.run(argv, check=check, stdout=S.PIPE, stderr=S.PIPE, text=True, timeout=timeout)
          
          
          def ctl(*args, check=True):
              return command(['sudo', '-n', 'systemctl', *args], check=check)
          
          
          def membership():
              rows = P.Path('/proc/self/cgroup').read_text().splitlines()
              return ROOT / next(x[3:] for x in rows if x.startswith('0::')).lstrip('/')
          
          
          def chain(path):
              path = path.resolve()
              assert path == ROOT or ROOT in path.parents
              while True:
                  yield path
                  if path == ROOT:
                      break
                  path = path.parent
          
          
          def retained_terminal(unit, terminal, cg):
              if not unit or not terminal: return False
              try: row = json.loads(P.Path(terminal).read_text())
              except FileNotFoundError: return False
              info = properties(unit)
              return (row.get('cgroup') == str(cg) and isinstance(row.get('result'), dict)
                      and bool(row['result'].get('SERVICE_RESULT'))
                      and set(row['result']) == {'SERVICE_RESULT', 'EXIT_CODE', 'EXIT_STATUS'}
                      and info.get('LoadState') in ('loaded', 'not-found')
                      and info.get('ActiveState') in ('inactive', 'failed'))
          
          
          def values(cg, unit=None, terminal=None):
              try:
                  cg.stat()
                  result = {k: (cg/k).read_text().strip() for k in KEYS if (cg/k).exists()}
                  # Detect removal between stat and the per-file existence checks too.
                  cg.stat()
                  return result
              except FileNotFoundError:
                  if not retained_terminal(unit, terminal, cg): raise
                  return {'unavailable': 'cgroup removed after retained terminal result; manager confirms stopped'}
          
          
          def available(paths):
              mem = {k: int(v.split()[0])*1024 for k, v in
                     (line.split(':', 1) for line in P.Path('/proc/meminfo').read_text().splitlines())}
              ram = min(mem['MemTotal'], mem['MemAvailable'])
              cpus = float(len(os.sched_getaffinity(0)))
              swap = mem['SwapFree']
              for cg in {p for path in paths for p in chain(path)}:
                  for limit, current, kind in [('memory.max', 'memory.current', 'ram'),
                                               ('memory.swap.max', 'memory.swap.current', 'swap')]:
                      if (cg/limit).exists() and (cg/limit).read_text().strip() != 'max':
                          left = max(0, int((cg/limit).read_text()) - int((cg/current).read_text()))
                          if kind == 'ram': ram = min(ram, left)
                          else: swap = min(swap, left)
                  if (cg/'cpuset.cpus.effective').exists():
                      spec = (cg/'cpuset.cpus.effective').read_text().strip()
                      count = sum(int(part.split('-')[-1])-int(part.split('-')[0])+1 for part in spec.split(',') if part)
                      if count: cpus = min(cpus, count)
                  if (cg/'cpu.max').exists():
                      quota, period = (cg/'cpu.max').read_text().split()
                      if quota != 'max': cpus = min(cpus, int(quota)/int(period))
              return mem, ram, cpus, swap
          
          
          def limits():
              assert (ROOT/'cgroup.controllers').exists(), 'cgroup v2 unavailable'
              assert {'memory', 'cpu'} <= set((ROOT/'cgroup.controllers').read_text().split())
              assert P.Path('/run/systemd/system').is_dir(), 'system systemd unavailable'
              command(['sudo', '-n', 'true'])
              mem, ram, cpus, swap = available([membership(), ROOT/'system.slice'])
              reserve = max(2*GIB, mem['MemTotal']//4)
              maximum = (int((ram-reserve)*.9)//(1024**2))*(1024**2)
              assert maximum >= GIB//2, 'insufficient observed RAM after supervisor reserve'
              assert cpus > 1, 'cannot reserve one CPU of quota for host'
              disk = shutil.disk_usage(TEMP)
              disk_floor = max(4*GIB, min(16*GIB, disk.total//10))
              assert disk.free > disk_floor+2*GIB, 'insufficient disk headroom'
              assert E.stat().st_dev == TEMP.stat().st_dev, 'capture/work disk mismatch'
              quota = math.floor((cpus-1)*100)
              return {'memory': maximum, 'high': maximum*3//4, 'swap': min(GIB, swap//2),
                      'quota_percent': quota, 'reserve_ram': reserve, 'disk_floor': disk_floor,
                      'observed': {'mem_total': mem['MemTotal'], 'mem_available': mem['MemAvailable'],
                                   'effective_ram_available': ram, 'effective_cpus': cpus,
                                   'effective_swap_free': swap, 'disk_free': disk.free}}
          
          
          def admit_capacity(budget, label):
              # Supplied retained effective failure envelope, not an inference about the lost hosted run.
              prior = 16*GIB
              minimum = prior+GIB
              usable = budget['memory']+budget['swap']
              needed_swap = max(0, minimum-budget['memory'])
              observed = budget['observed']
              added_swap = max(0, 2*needed_swap-observed['effective_swap_free'])
              disk_room = max(0, observed['disk_free']-budget['disk_floor']-3*GIB)
              evidence = {'prior_effective_failure_bytes': prior, 'prior_source': 'retained executor confirmed 16 GiB OOM; not lost hosted run',
                          'minimum_admission_bytes': minimum, 'child_ram_bytes': budget['memory'],
                          'child_swap_bytes': budget['swap'], 'usable_child_bytes': usable,
                          'reserve_ram_bytes': budget['reserve_ram'], 'admitted': usable >= minimum,
                          'claim': 'larger budget only; neither sufficiency nor completion is established',
                          'overflow_option': {'provisioning': 'not attempted or authorized by this carrier',
                              'required_child_swap_bytes': needed_swap,
                              'additional_host_swap_bytes_under_half_free_policy': added_swap,
                              'disk_bytes_after_floor_capture_and_work_reserves': disk_room,
                              'disk_arithmetic_fits': added_swap <= disk_room,
                              'unverified_requirements': ['explicitly revise current 1 GiB child swap cap',
                                  'filesystem supports a fully allocated swap file', 'swapon succeeds and is read back',
                                  'ancestor swap limits permit the required budget',
                                  'recompute free disk/RAM/swap after provisioning and preserve all reserves']}}
              save(E/('capacity-'+label+'.json'), evidence)
              print('CAPACITY '+json.dumps(evidence), flush=True)
              assert evidence['admitted'], 'capacity blocker: usable child RAM+swap below 17 GiB admission minimum; no producer attempted'
              return evidence
          
          
          def child():
              # Only this wait/exec shim and its descendants are inside the limited unit.
              config = json.loads(P.Path(sys.argv[2]).read_text())
              gate = P.Path(config['gate'])
              end = time.monotonic()+30
              while not gate.exists():
                  if time.monotonic() > end: raise SystemExit(125)
                  time.sleep(.05)
              os.execvpe(config['argv'][0], config['argv'], config['env'])
          
          
          def post():
              # Executed after child cleanup, before the cgroup disappears. No env dump.
              save(P.Path(sys.argv[2]), {'time': time.time(), 'cgroup': str(membership()),
                   'values': values(membership()),
                   'result': {k: os.environ.get(k) for k in ('SERVICE_RESULT', 'EXIT_CODE', 'EXIT_STATUS')}})
          
          
          def properties(unit):
              p = ctl('show', unit, '--property=LoadState,ActiveState,SubState,ControlGroup,MainPID,Result,ExecMainCode,ExecMainStatus,User,Group,KillMode,Restart,OOMPolicy', check=False)
              return dict(line.split('=', 1) for line in p.stdout.splitlines() if '=' in line)
          
          
          def empty(cg, unit=None, terminal=None):
              try:
                  return dict(line.split() for line in (cg/'cgroup.events').read_text().splitlines()).get('populated') == '0'
              except FileNotFoundError:
                  if not retained_terminal(unit, terminal, cg): raise
                  return True
          
          
          def cleanup_one(record):
              unit = record['unit']; cg = P.Path(record['cgroup']) if record.get('cgroup') else None
              ctl('stop', unit, check=False)
              info = properties(unit)
              # An absent/unknown path is not evidence of emptiness of a running service.
              if cg is None and info.get('ControlGroup'): cg = ROOT/info['ControlGroup'].lstrip('/')
              quiet = (cg is None or empty(cg, unit, record.get('terminal'))) and info.get('LoadState') in ('loaded', 'not-found') and info.get('ActiveState') in ('inactive', 'failed')
              assert quiet, 'unit not confirmed stopped/empty: '+unit
              return {'unit': unit, 'empty': True, 'properties': info}
          
          
          def cleanup_all():
              results = []
              for path in sorted(STATE.glob('*.registry.json')):
                  results.append(cleanup_one(json.loads(path.read_text())))
              # A small real disk reserve is released only after every unit is confirmed empty.
              (STATE/'capture.reserve').unlink(missing_ok=True)
              save(E/'unit-cleanup.json', results)
              return results
          
          
          def run_unit(label, argv, cwd, env=None, probe=False):
              budget = limits()
              if probe: budget.update(memory=32*1024**2, high=24*1024**2, swap=0, quota_percent=50)
              else: admit_capacity(budget, label)
              remaining = int(os.environ['PRODUCER_DEADLINE'])-int(time.time())
              assert remaining > 60, 'no producer time left'
              runtime = min(25, remaining-45) if probe else remaining-45
              unit = 'lexlean-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+'-'+label+'.service'
              STATE.mkdir(exist_ok=True)
              path = STATE/(label+'.json'); gate = STATE/(label+'.go')
              assert not path.exists() and not gate.exists(), 'no retry within a job'
              # Explicit non-secret environment, including native tool paths; never inherit tokens.
              names = ('HOME', 'PATH', 'USER', 'LOGNAME', 'LANG', 'LC_ALL', 'TMPDIR', 'RUSTUP_HOME',
                       'CARGO_HOME', 'CARGO_TARGET_DIR', 'CARGO_INCREMENTAL', 'CARGO_BUILD_JOBS',
                       'RUST_TEST_THREADS', 'LEXLEAN_VERIFY_WIDTH', 'LEXLEAN_CI_TELEMETRY',
                       'CARGO_NET_OFFLINE', 'LEXLEAN_EXAMPLES_PART')
              child_env = {k: (env or os.environ)[k] for k in names if k in (env or os.environ)}
              save(path, {'argv': argv, 'env': child_env, 'gate': str(gate)})
              path.chmod(0o600)
              terminal = E/(label+'-terminal.json'); registry = STATE/(label+'.registry.json')
              record = {'unit': unit, 'cgroup': None, 'terminal': str(terminal)}; save(registry, record)
              props = {'Type': 'exec', 'User': str(os.getuid()), 'Group': str(os.getgid()),
                       'WorkingDirectory': str(cwd), 'Restart': 'no', 'KillMode': 'control-group',
                       'OOMPolicy': 'kill', 'MemoryAccounting': 'yes', 'CPUAccounting': 'yes',
                       'MemoryHigh': str(budget['high']), 'MemoryMax': str(budget['memory']),
                       'MemorySwapMax': str(budget['swap']), 'CPUQuota': str(budget['quota_percent'])+'%',
                       'CPUQuotaPeriodSec': '100ms', 'TimeoutStartSec': '30s', 'TimeoutStopSec': '15s',
                       'RuntimeMaxSec': str(runtime)+'s', 'SendSIGKILL': 'yes', 'NoNewPrivileges': 'yes',
                       'ExecStopPost': '/usr/bin/python3 '+str(P.Path(__file__).resolve())+' post '+str(terminal)}
              # ExecStopPost paths are parsed by systemd, so reject syntax rather than interpolate it.
              for val in (str(P.Path(__file__).resolve()), str(terminal), str(cwd)):
                  assert all(c.isalnum() or c in '/._-' for c in val), 'unsafe systemd property path'
              args = ['sudo', '-n', 'systemd-run', '--unit='+unit, '--quiet', '--pipe', '--wait', '--expand-environment=no']
              args += ['--setenv=RUNNER_TEMP='+str(TEMP), '--setenv=GITHUB_WORKSPACE='+str(E.parent)]
              args += ['--property='+k+'='+v for k, v in props.items()]
              args += ['/usr/bin/python3', str(P.Path(__file__).resolve()), 'child', str(path)]
              proc = S.Popen(args, stdin=S.DEVNULL, stdout=S.PIPE, stderr=S.STDOUT)
              selector = selectors.DefaultSelector(); selector.register(proc.stdout, selectors.EVENT_READ)
              cg = None; released = False; reason = None; started = time.monotonic(); last = 0; written = 0
              summary = {'unit': unit, 'limits': budget, 'supervisor_pid': os.getpid(), 'status': 'starting'}
              save(E/(label+'-unit.json'), summary)
              try:
                  with (E/(label+'.log')).open('wb') as log, (E/(label+'-resources.jsonl')).open('a') as samples:
                      while True:
                          for key, _ in selector.select(.2):
                              data = os.read(key.fd, 65536)
                              if data:
                                  sys.stdout.buffer.write(data); sys.stdout.buffer.flush()
                                  keep = data[:max(0, 64*1024**2-written)]
                                  log.write(keep); log.flush(); written += len(keep)
                              else: selector.unregister(key.fileobj)
                          now = time.monotonic()
                          if not released:
                              info = properties(unit)
                              if info.get('ControlGroup') and int(info.get('MainPID', '0')):
                                  cg = ROOT/info['ControlGroup'].lstrip('/')
                                  record['cgroup'] = str(cg); save(registry, record)
                                  observed = values(cg)
                                  assert int(observed['memory.max']) == budget['memory']
                                  assert int(observed['memory.high']) == budget['high']
                                  assert int(observed['memory.swap.max']) == budget['swap']
                                  assert observed['memory.oom.group'] == '1'
                                  q, period = map(int, observed['cpu.max'].split())
                                  assert period == 100000 and q == budget['quota_percent']*1000
                                  assert info['User'] in (str(os.getuid()), os.environ['USER'])
                                  assert info['Group'] in (str(os.getgid()), command(['id', '-gn']).stdout.strip())
                                  assert info['Restart'] == 'no' and info['KillMode'] == 'control-group' and info['OOMPolicy'] == 'kill'
                                  assert membership() != cg and cg not in membership().parents
                                  # Recheck actual ancestors, excluding this unit's own imposed cap.
                                  mem, ram, cpus, swap = available([membership(), cg.parent])
                                  assert ram >= budget['memory']+budget['reserve_ram'] if not probe else ram > budget['reserve_ram']
                                  assert cpus >= budget['quota_percent']/100+(.5 if probe else 1)
                                  assert swap >= budget['swap']
                                  summary.update(status='verified', cgroup=str(cg))
                                  summary['readback'] = observed
                                  save(E/(label+'-unit.json'), summary)
                                  gate.touch(); released = True
                              elif now-started > 20 or proc.poll() is not None:
                                  raise RuntimeError('unit unavailable before gate release')
                          if now-last >= 5:
                              row = {'time': time.time(), 'unit': unit, 'values': values(cg, unit, terminal) if cg else {},
                                     'disk_free': shutil.disk_usage(TEMP).free}
                              samples.write(json.dumps(row)+'\n'); samples.flush()
                              print('RESOURCE '+json.dumps(row), flush=True); last = now
                          if shutil.disk_usage(TEMP).free < budget['disk_floor']:
                              reason = 'disk-headroom'; raise RuntimeError(reason)
                          if now-started > runtime+20:
                              reason = 'supervisor-timeout'; raise TimeoutError(reason)
                          if proc.poll() is not None and not selector.get_map(): break
                  rc = proc.wait(timeout=1)
                  terminal_result = json.loads(terminal.read_text())
                  summary.update(status='finished', systemd_run_exit=rc, terminal=terminal_result,
                                 log_bytes_retained=written, log_cap_bytes=64*1024**2)
                  save(E/(label+'-unit.json'), summary)
                  return rc, terminal_result
              except BaseException as err:
                  summary.update(status='interrupted', reason=reason or repr(err)); save(E/(label+'-unit.json'), summary)
                  raise
              finally:
                  # Stop the entire service, not just its systemd-run client. Verify before capture.
                  try: save(E/(label+'-cleanup.json'), cleanup_one(record))
                  finally:
                      if proc.poll() is None:
                          proc.terminate()
                          try: proc.wait(timeout=5)
                          except S.TimeoutExpired: proc.kill(); proc.wait(timeout=5)
                      selector.close(); proc.stdout.close()
                      path.unlink(missing_ok=True); gate.unlink(missing_ok=True)
          
          
          def checked(label, argv, cwd):
              rc, terminal = run_unit(label, argv, cwd)
              result = terminal['result']
              if rc or result != {'SERVICE_RESULT': 'success', 'EXIT_CODE': 'exited', 'EXIT_STATUS': '0'}:
                  raise RuntimeError(label+' child failed: '+json.dumps({'client_exit': rc, 'child': result}))
          
          
          def preflight():
              E.mkdir(exist_ok=True); STATE.mkdir(exist_ok=True)
              b = limits()
              b['systemd_version'] = command(['systemd-run', '--version']).stdout
              b['kernel_release'] = os.uname().release
              b['ancestor_readback'] = {str(cg): values(cg) for path in [membership(), ROOT/'system.slice'] for cg in chain(path)}
              save(E/'host-budget.json', b)
              admit_capacity(b, 'preflight')
              command(['fallocate', '-l', str(GIB), str(STATE/'capture.reserve')])
              # Bounded 128 MiB attempted allocation against a verified 32 MiB/no-swap child cap.
              code = 'x=[]\nfor i in range(128):\n x.append(bytearray(1024*1024))\n'
              rc, terminal = run_unit('probe', ['/usr/bin/python3', '-c', code], TEMP, probe=True)
              result = terminal['result']; events = dict(line.split() for line in terminal['values']['memory.events'].splitlines())
              assert rc != 0 and result['SERVICE_RESULT'] == 'oom-kill'
              assert result['EXIT_CODE'] == 'killed' and result['EXIT_STATUS'] in ('KILL', '9')
              assert int(events['oom_kill']) >= 1
              save(E/'probe-passed.json', {'passed': True, 'supervisor_alive': True, 'supervisor_pid': os.getpid(),
                                         'time': time.time(), 'child': result, 'events': events})
              print('PREFLIGHT PASS: bounded child OOM; supervisor survived; unit empty', flush=True)
          
          
          if __name__ == '__main__':
              if sys.argv[1] == 'child': child()
              elif sys.argv[1] == 'post': post()
              elif sys.argv[1] == 'preflight': preflight()
              elif sys.argv[1] == 'cleanup': cleanup_all()
              else: raise SystemExit('unknown operation')
          CONTAINMENT
          python3 "$RUNNER_TEMP/lexlean-containment.py" preflight
      - name: Retain preflight evidence before producer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-${{ inputs.stage }}-preflight
          path: |
            evidence/host-budget.json
            evidence/capacity-*.json
            evidence/probe*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.stage == 'verify'
        with:
          name: native-export-products
          path: incoming
      - name: Install native pinned tools (one attempt)
        working-directory: ${{ runner.temp }}/work
        run: |
          set -euo pipefail
          rustup toolchain install
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20
        with:
          tool: just
      - name: Guard and run exactly one owning recipe
        id: run
        timeout-minutes: 335
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(( PRODUCER_DEADLINE - $(date +%s) ))
          if (( remaining <= 0 )); then
            printf '{"status":"interrupted","reason":"deadline exhausted before producer"}\n' > evidence/supervisor.json
            exit 124
          fi
          set +e
          timeout --signal=TERM --kill-after=30s "${remaining}s" python3 - <<'PY'
          import os, pathlib as P, subprocess as S, hashlib as H, json, time, threading, tarfile, stat
          import importlib.util, signal
          spec=importlib.util.spec_from_file_location('containment',P.Path(os.environ['RUNNER_TEMP'])/'lexlean-containment.py')
          contained=importlib.util.module_from_spec(spec); spec.loader.exec_module(contained)
          assert json.loads((P.Path('evidence')/'probe-passed.json').read_text())['passed'] is True
          def terminated(signum,frame): raise TimeoutError('supervisor received signal '+str(signum))
          signal.signal(signal.SIGTERM,terminated)
          w=P.Path(os.environ['RUNNER_TEMP'])/'work'; e=P.Path('evidence').resolve()
          e.mkdir(exist_ok=True); stage=os.environ['STAGE']; assert stage in ('export','verify')
          def call(*a): return S.check_output(a,cwd=w).decode().strip()
          def digest(p): return H.sha256(P.Path(p).read_bytes()).hexdigest()
          def snap():
              names=call('git','ls-files','--cached','--others','--exclude-standard','-z').split('\0')
              return {n:H.sha256(os.readlink(w/n).encode() if (w/n).is_symlink() else (w/n).read_bytes()).hexdigest() for n in names if n and (w/n).exists()}
          def save(n,v): (e/n).write_text(json.dumps(v,indent=2,sort_keys=True)+'\n')
          def resources():
              cg=P.Path('/sys/fs/cgroup'); membership=P.Path('/proc/self/cgroup').read_text()
              rel=next((x.split(':',2)[2] for x in membership.splitlines() if x.startswith('0::')), '/')
              nested=cg/rel.lstrip('/'); cg=nested if (nested/'memory.max').exists() else cg
              return {'time':time.time(),'cgroup_path':str(cg),'membership':membership,'meminfo':P.Path('/proc/meminfo').read_text(),
