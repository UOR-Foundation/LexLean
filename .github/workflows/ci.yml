          sudo fallocate -l 4G "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo chmod 600 "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo mkswap "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo swapon "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo sysctl vm.swappiness=10
          swapon --show
      - name: Run the shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence ci-parts
          sample_resources() {
            set +e
            while true; do
              avail=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
              swap=$(awk '/^SwapTotal:/ {t=$2} /^SwapFree:/ {f=$2} END {print t-f}' /proc/meminfo)
              top=$( (ps -eo rss= --sort=-rss || true) | awk 'NR==1 {print $1}')
              printf '%s\t%s\t%s\t%s\n' "$(date +%s.%N | cut -c1-14)" "$avail" "$swap" "${top:-0}"
              sleep 5
            done
          }
          sample_resources > ci-evidence/resources.tsv &
          sample_pid=$!
          trap 'kill "$sample_pid" 2>/dev/null || true; wait "$sample_pid" 2>/dev/null || true' EXIT
          ci-parts/atlas-xtask/xtask verify-examples 2>&1 | tee ci-evidence/vv.txt
      - name: Summarize the run's timing and memory
        if: ${{ !cancelled() }}
        run: ci-parts/atlas-xtask/xtask ci-summary --evidence ci-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-part-${{ matrix.shard }}
          path: ci-parts/${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: acceptance-gate-evidence-atlas-${{ matrix.shard }}
          path: ci-evidence
          if-no-files-found: error
          retention-days: 14

  # The join: the last four modules, then every shard's records in the
  # canonical order, the attestation, publication, and the comparison with
  # `expected/verify`.
  atlas-join:
    name: atlas (join)
    if: ${{ needs.plan.outputs.full == 'true' }}
    needs: [plan, atlas-prefix, atlas-cert4, atlas-l1, atlas-census-tail, atlas-cert4-replay, atlas-closure, atlas-l3]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LEXLEAN_CI_TELEMETRY: ${{ github.workspace }}/ci-evidence
      # The part of the examples recipe this job runs (§9.4), and where the
      # parts of the run exchange their output.
      LEXLEAN_EXAMPLES_PART: join:uor-atlas
      LEXLEAN_EXAMPLES_PARTS: ${{ github.workspace }}/ci-parts
      # The resource profile of the examples leg (§22.11), the same for every
      # shard; operational only.
      LEXLEAN_VERIFY_WIDTH: "2"
      LEXLEAN_VERIFY_MEMORY_KIB: "12582912"
      LEXLEAN_VERIFY_HINTS: ${{ github.workspace }}/.github/verify-hints.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install elan and the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      # What the jobs of this run before this one wrote: the gate's executable
      # and every shard's output so far, each under the name it was uploaded
      # with. The verifier reads the shards this one needs and no other.
      - name: Take the gate's executable and the shards before this one from the run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: atlas-*
          path: ci-parts
      - name: Place the parts under the names of their shards
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ci-parts/atlas-xtask/xtask
          for part in ci-parts/atlas-part-*; do
            mv "$part" "ci-parts/${part#ci-parts/atlas-part-}"
          done
          ls ci-parts
      - name: Reserve bounded overflow memory for native Atlas
        run: |
          set -euo pipefail
          sudo fallocate -l 4G "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo chmod 600 "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo mkswap "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo swapon "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo sysctl vm.swappiness=10
          swapon --show
      - name: Run the join (the last modules, every shard's records, the attestation)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence ci-parts
          sample_resources() {
            set +e
            while true; do
              avail=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
              swap=$(awk '/^SwapTotal:/ {t=$2} /^SwapFree:/ {f=$2} END {print t-f}' /proc/meminfo)
              top=$( (ps -eo rss= --sort=-rss || true) | awk 'NR==1 {print $1}')
              printf '%s\t%s\t%s\t%s\n' "$(date +%s.%N | cut -c1-14)" "$avail" "$swap" "${top:-0}"
              sleep 5
            done
          }
          sample_resources > ci-evidence/resources.tsv &
          sample_pid=$!
          trap 'kill "$sample_pid" 2>/dev/null || true; wait "$sample_pid" 2>/dev/null || true' EXIT
          ci-parts/atlas-xtask/xtask verify-examples 2>&1 | tee ci-evidence/vv.txt
      - name: Summarize the run's timing and memory
        if: ${{ !cancelled() }}
        run: ci-parts/atlas-xtask/xtask ci-summary --evidence ci-evidence
      # The join publishes Atlas's verified directory and compares its records
      # with `expected/verify` as the examples leg did; these lines are what it
      # prints when it has, and a join that did not print them fails here.
      - name: Assert native Atlas was verified by the acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F "verify-examples: uor-atlas verified (attestation " ci-evidence/vv.txt
          grep -F "verify-examples: uor-atlas: 347 normalized verification records equal expected/verify (§29.5)" ci-evidence/vv.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: acceptance-gate-evidence-atlas-join
          path: ci-evidence
          if-no-files-found: error
          retention-days: 14

  # §8.3: the crate builds and its non-Lean tests pass on every supported
  # host. This job installs no Lean toolchain on purpose — that is the
  # property under test. A case whose assertions need the pinned toolchain
  # goes through `repo_conformance::support::lean_backed`, which on a
  # non-normative host runs the case's platform-independent assertions and
  # reports which ones it skipped; on Linux x86-64 the same gate makes the
  # toolchain mandatory, so nothing passes vacuously where it matters.
  #
  # The two hosts below keep their original single invocation. Windows runs
  # as lanes below, each building for itself, and Intel's conformance
  # execution is partitioned below after one construction; each aggregate
  # retains its supported-host status (issue #449).
  # There is no separate build step here: `cargo test` with the same `--locked
  # --workspace --all-features` builds, in the same profile, the library and the
  # binary of `lexlean` (its integration tests run the binary) before it runs a
  # test, so a crate that does not build fails this job at the same step. A
  # separate build step added only the non-test compilation of the repository's
  # own `xtask` and `repo-conformance`, which no host in this job runs.
  host-matrix:
    name: build and non-Lean tests (${{ matrix.target }})
    needs: [plan, honesty]
    if: ${{ needs.plan.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    # Keep the existing bound; scheduling changes do not extend it.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # The image label and the host triple are separate facts. A runner
      # image that changed architecture underneath the label would otherwise
      # leave one of the five §8.3 hosts silently untested.
      - name: The runner is the host this leg claims
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::${{ matrix.os }} is $host, not ${{ matrix.target }} (SPEC.md §8.3)"
            exit 1
          fi
          echo "$host"
      # `--no-fail-fast`: cargo otherwise stops at the first test binary that
      # fails, so a host with two independent failures reports one, and each
      # further one costs a whole run of the leg. The job fails exactly when a
      # test fails, as before; only what it reports is complete (SPEC.md §8.3).
      - run: cargo test --locked --workspace --all-features --no-fail-fast

  # Construct Intel workspace tests once, then keep ordinary tests, every
  # non-conformance harness, and all doctests on their original runner. The
  # conformance binary embeds its checkout path and builds generated packages
  # offline, so its same-run handoff includes those explicit dependencies.
  # No build cache, credentials, or evidence from another run is admitted.
  intel-construction:
    name: Intel test construction and local targets
    needs: [plan, honesty]
    if: ${{ needs.plan.outputs.full == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 240
    outputs:
      lanes: ${{ steps.construct.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Construct tests and execute the producer's complete targets
        id: construct
        run: python3 .github/scripts/intel_host_tests.py build --output "$RUNNER_TEMP/intel-construction"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: intel-construction
          path: ${{ runner.temp }}/intel-construction
          if-no-files-found: error
          retention-days: 14

  intel-part:
    name: Intel conformance (${{ matrix.lane }})
    needs: [plan, intel-construction]
    if: ${{ needs.plan.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.intel-construction.outputs.lanes) }}
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intel-construction
          path: ${{ runner.temp }}/intel-input/intel-construction
      - name: Execute this lane against the checked construction
        run: python3 .github/scripts/intel_host_tests.py execute --construction "$RUNNER_TEMP/intel-input/intel-construction" --lane ${{ matrix.lane }} --output "$RUNNER_TEMP/intel-${{ matrix.lane }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: intel-${{ matrix.lane }}
          path: ${{ runner.temp }}/intel-${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 14

  # This is the fourth §8.3 host status, not an additional acceptance owner.
  # Run even after failure so missing parts and all reported failures are
  # visible together. Successful construction alone never accepts a host.
  intel-join:
    name: build and non-Lean tests (x86_64-apple-darwin)
    needs: [plan, intel-construction, intel-part]
    if: ${{ always() && needs.plan.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: intel-*
          path: ${{ runner.temp }}/intel-input
      - name: Verify the complete Intel inventory and execution receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intel-evidence"
          python3 .github/scripts/intel_host_tests.py join --artifacts "$RUNNER_TEMP/intel-input" 2>&1 | tee "$RUNNER_TEMP/intel-evidence/intel-join.txt"
      - name: All Intel execution jobs succeeded
        if: ${{ always() }}
        shell: bash
        env:
          CONSTRUCTION_RESULT: ${{ needs.intel-construction.result }}
          PART_RESULT: ${{ needs.intel-part.result }}
        run: |
          set -euo pipefail
          test "$CONSTRUCTION_RESULT" = success
          test "$PART_RESULT" = success
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: acceptance-gate-evidence-intel
          path: ${{ runner.temp }}/intel-evidence
          if-no-files-found: error
          retention-days: 14

  # Windows x86-64 as lanes of one run (§8.3): its one `cargo test` took 106
  # to 126 minutes, the longest job of the gate, almost all of it the
  # conformance harness. Each lane is its own clean checkout and build; the
  # conformance lanes run the cases of the Intel lanes' partition
  # (`.github/intel-host-lanes.json`), and `producer` runs every other test
  # and doctest of the workspace. Each lane records what the host listed and
  # what ran, and the join requires every lane of this run and commit, lanes
  # that are disjoint, and an execution equal to the host's whole listing,
  # before the host's context passes.
  windows-part:
    name: Windows tests (${{ matrix.lane }})
    needs: [plan, honesty]
    if: ${{ needs.plan.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        lane: [producer, lower, print, validate, moves]
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: The runner is the host this leg claims
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != x86_64-pc-windows-msvc ]; then
            echo "::error::windows-2022 is $host, not x86_64-pc-windows-msvc (SPEC.md §8.3)"
            exit 1
          fi
          echo "$host"
      - name: Execute this lane and record its inventory
        shell: bash
        run: python .github/scripts/host_lanes.py execute --target x86_64-pc-windows-msvc --lane ${{ matrix.lane }} --output "$RUNNER_TEMP/host-lane"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: host-x86_64-pc-windows-msvc-${{ matrix.lane }}
          path: ${{ runner.temp }}/host-lane
          if-no-files-found: error
          retention-days: 14

  # The Windows host status: every lane's receipt, joined. It runs even after
  # a failure, so a missing lane reads as a failure and never as success.
  windows-join:
    name: build and non-Lean tests (x86_64-pc-windows-msvc)
    needs: [plan, windows-part]
    if: ${{ always() && needs.plan.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: host-x86_64-pc-windows-msvc-*
          path: ${{ runner.temp }}/host-lanes
      - name: Verify every lane and the complete Windows inventory
        run: python3 .github/scripts/host_lanes.py join --target x86_64-pc-windows-msvc --artifacts "$RUNNER_TEMP/host-lanes"
      - name: All Windows lanes succeeded
        if: ${{ always() }}
        shell: bash
        env:
          PART_RESULT: ${{ needs.windows-part.result }}
        run: |
          set -euo pipefail
          test "$PART_RESULT" = success
