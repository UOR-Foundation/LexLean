level = "build"
suite = "reasoning"
statement = "The compiler project's reasoning oracles declare exactly the declarations of every reasoner the reasoning example's production roots run (the forward reasoners Triage and Grade, the generic Spend, the breadth-first search Plan with deduplication, the depth-first search Screen, and the generate-and-verify reasoner Dose) and of Review, which the example states by theorem, and a calculus transcription of each produces the oracle's verdict on every fixture argument as the kernel decides, the explained answer and the six-counter ledger of its run too for Triage, Plan, Screen, and Dose, compiles to committed rust-core and rust-std packages, and charges at least the guard evaluations and firings of the reasoner's ledger in calculus steps."

[[id]]
id = "RS-13"
level = "build"
suite = "reasoning"
statement = "GNAF requests over forward-chaining plans of the clinical rule base charge rule search as execution in calculus steps and are answered over their declared plans, each plan computes on every patient of the request's domain the level the oracle's Triage derives from the same findings as the kernel decides, and a request whose search is charged nothing or whose universe is the candidates a search discovered is refused."

[[id]]
id = "RS-14"
level = "build"
suite = "reasoning"
statement = "The committed reasoning example verifies a multi-step clinical forward derivation with its invariant and termination, a generic terminating countdown, a deduplicating breadth-first planner, a depth-first search and a generate-and-verify reasoner over model-generated candidates, and an answer proved correct with its check erased, with every generated theorem kernel-checked, and planting a rule-threshold mutation in it is refused by verification."

[[id]]
id = "OR-01"
level = "build"
suite = "oracle"
statement = "The differential oracle is lean4-prod, pinned in oracle/lean4-prod.toml by its remote, its exact commit, and the SHA-256 of the canonical frame of every file the integration uses, with the role validation-evidence and nothing of it vendored because its repository ships no licence text; a checkout is acquired only if those files hash to the pin and, in a git checkout, HEAD is the pinned commit, and a pin with another role or a missing, unknown, vendored, or malformed field, a checkout with one byte changed, one file added, removed, or renamed, an empty checkout, a pin whose Rust or Lean toolchain is not the repository's own, and an authority row or ledger claim that cites the oracle are each refused."

[[id]]
id = "OR-02"
level = "build"
suite = "oracle"
statement = "The differential corpus is every production root of examples/production, examples/production-coverage, examples/models, and examples/reasoning, a minimal probe root for each runtime construct of the production registry that those roots do not realize in a root the oracle accepts, and the committed production-refusal fixtures with their marking removed; every construct of the registry is realized in the closure of a corpus root the oracle accepts and whose crate compiles or is a row of the known-non-overlap table, versioned by the digest of its rows, a formal-only or erased construct as such and a runtime construct with a probe whose refusal or failure to compile is re-asserted, and a construct in neither, a row for a construct a compiled root realizes, a row whose probe the oracle no longer answers in the stated way, and a row naming no construct of the registry are each refused."

[[id]]
id = "OR-03"
level = "build"
suite = "oracle"
statement = "On every corpus root the oracle accepts, the Rust it generates is built under the pinned rustc and called on the seeded inputs of the RB-06 and SP-11 differentials and on boundary inputs derived from the types and literals of the root, among them every constructor of every parameter type, the bounds of each integer width and their neighbours, and the delimiters of its strings, and its observable outcome, an overflow included, equals the interpreter's and LexLean's own rendering's, its signature, failure typing, and parameter passing equal the root's contract except where a known difference lists it, and no call of a root eligible for rust-core allocates or panics; the acceptance or refusal of every other root equals the verdict the tables record, and the oracle's refusal of each root that LexLean rejects is the kind its row states, so that a refusal for another reason is a disagreement, and the whole run is validated."

[[id]]
id = "OR-04"
level = "build"
suite = "oracle"
statement = "A planted arithmetic discrepancy (a checked operation made wrapping at a bound of its width, a division, negation, or addition changed, a shift past the width, a replaced operation, or an off-by-one literal or limit), a planted control discrepancy (swapped branches, an inverted comparison, a dropped recursive arm, a changed constant in a match arm, an append in the other order), a planted resource discrepancy (an allocation in a rust-core root), and a planted ABI discrepancy (swapped parameters, a changed parameter width, a dropped failure typing) in the oracle's generated Rust are each detected as a disagreement that records the root, the inputs, and both sides' outcomes or contracts, however many plants share a root, since each is built and judged under a key of its own, while the unplanted crates, a rewrite of each plant's site that means the same, and an edit that changes no behavior are not discrepancies."

[[id]]
id = "OR-05"
level = "build"
suite = "oracle"
statement = "Known deliberate differences are the rows of oracle/known-differences.toml, each with its kind, name, reason, and exact roots, and its rows and those of the known-non-overlap table are versioned by content, the version of each naming the digest of its rows in oracle/table-versions.toml; a difference of the run that no row names is a disagreement, a listed difference is accepted, and a row that lists a root on which the difference no longer arises, a row with no reason or no root, a repeated row, an unknown field, a row changed without a new version, a version raised without its digest recorded, and a version that changed nothing are each refused, so that every difference LexLean and the oracle have is stated, tested, and re-asserted on every run."

[[id]]
id = "OR-06"
level = "build"
suite = "oracle"
statement = "The differential compares outcomes, contracts, and resources and never bytes: a rendering that is deliberately better than LexLean's and semantically equivalent to it, a loop for a recursion and a closed form for an iteration, byte-different from LexLean's rendering and from the oracle's, is accepted on every input, and a rendering that differs in one result on one input, that takes a parameter of another width, that does more work than LexLean's as its own runtime counts it, or that allocates more as an allocator it cannot reach counts it is refused."

[[id]]
id = "OR-07"
level = "build"
suite = "oracle"
statement = "An oracle that was not acquired, whose checkout is not the pin, that did not build, that crashed, was killed, overran its time (and with it everything it started), wrote nothing or an IR defining nothing, or whose generator failed without refusing a program, a fetch that fails leaving nothing that a later run takes for a checkout, a cache that is not the pin discarded and fetched once more, a transient failure of the network tried again twice and a permanent one not, and a comparison over no root or no case, are each unavailable and never validated, which fails the gate on the normative host and is reported as not validated elsewhere, while the oracle's own structured refusals are answers and a tool that is not meant to overrun its time is given a generous one; and a disagreement fails closed with a record of both sides' evidence for every difference."

[[id]]
id = "OR-08"
level = "build"
suite = "oracle"
statement = "The oracle is validation evidence and an input to no identity: no file the shipped crate, the language data, the schemas, the compiler project, the committed examples' records, or the authority and ledger files hold names the oracle, its pinned commit, or its digest, so that planting any of them in any of those places fails audit-oracle-isolation; no input of the compiler-semantics ID names it, an oracle field in a build manifest, a preservation record, an attestation, a snapshot, a compiler input, or a GNAF certificate fails its closed schema, and no module of the conformance crate but the oracle's own uses it, so that removing it changes none of them."

[[id]]
id = "PX-01"
level = "build"
suite = "production-export"
statement = "A consumer that names only lexlean::api::production and the stable crate-root types exports every production root of examples/production and examples/production-coverage through production::build into a bundle whose every Rust package is byte-identical to its committed expected package and renders the certified crate followed by one export, run, of the root's recorded entry, and whose result binds every output to the project's source, semantic, and lock identities, the compiler-semantics ID, its target ID and descriptor digest, the compiler input and preservation record the attestation binds, certificates A, B, and E, and the certification status kernel-checked, with optimality not-claimed."

[[id]]
id = "PX-02"
level = "build"
suite = "production-export"
statement = "A production request naming an unknown root, a declaration that is not a production root, or a formal-only theorem fails with LLC0202 before any Lean process runs and publishes no build, verification, or production directory."

[[id]]
id = "PX-03"
level = "build"
suite = "production-export"
statement = "A production request naming an unregistered target, a registered target its root does not declare, or a registered target with any other descriptor digest fails with LLC0203 before any Lean process runs and publishes nothing, and production::targets returns each registered target's descriptor with a digest that changes with any field of it."

[[id]]
id = "PX-04"
level = "build"
suite = "production-export"
statement = "A production request pinning a source ID, semantic ID, or lock digest that a later edit of a source module or of the lock no longer matches fails with LLC0204 before any Lean process runs and publishes nothing, and a lock made stale by an edit of the project configuration fails with LLC0102."

[[id]]
id = "PX-05"
level = "build"
suite = "production-export"
statement = "Every committed production-refusal fixture of tests/negative fails through production::build with its committed diagnostic code before any Lean process runs and publishes no production directory."

[[id]]
id = "PX-06"
level = "build"
suite = "production-export"
statement = "GNAF evidence whose certificate has another identity than the request pins, earns a refused verdict, or is for a request whose reference program is not the root's lowered program fails with LLV7101, a malformed request or certificate fails with LLB6006 or LLB6007, each before any Lean process runs, a request carrying a certification, optimality, preservation, certificate, Lean, program, or crate field fails with LLC0201, and evidence that binds the root is recorded with the identity, universe, and verdict the host checker recomputes."

[[id]]
id = "PX-07"
level = "build"
suite = "production-export"
statement = "verify_artifact accepts an untouched bundle with status bindings-verified and names the four stages it does not re-run, and rejects with LLV7102 a bundle in which one byte of a package, crate, program, certificate, attestation, compiler input, or preservation record, one binding or certification field of the result with its identity recomputed, or one added or removed file differs, and with LLS8001 a bundle holding a symlink."

[[id]]
id = "PX-08"
level = "build"
suite = "production-export"
statement = "Exporting one request from two copies of a project in distinct absolute directories and from distinct working directories yields byte-identical bundles under one result ID, and the result holds no absolute path, environment value, or time."

[[id]]
id = "PX-09"
level = "build"
suite = "production-export"
statement = "Evidence paths that are absolute, contain .., or pass through a symlink leaving the project fail with LLS8001 before any Lean process runs, and a symlinked production area under the build root is refused with LLS8001 rather than followed."

[[id]]
id = "PX-10"
level = "build"
suite = "production-export"
statement = "After setup, production::build takes no network option and starts no network or git operation: with a git sentinel first on PATH and an unreachable proxy in the environment it exports the project and the sentinel never runs, and a project whose lock needs an unacquired Git package fails closed with a registered code without acquiring it."

[[id]]
id = "PX-11"
level = "build"
suite = "production-export"
statement = "No production request type can carry Lean, LCNF, a target program, or Rust: every field is a root name, a crate name and version, a registered target ID with a digest, a pinned digest, or a project-relative evidence path, as an exhaustive destructuring of each request type shows, and a root name, crate name, or version carrying Lean or Rust text fails with LLC0201, while evidence naming a Lean file fails as a malformed GNAF document."

[[id]]
id = "PX-12"
level = "build"
suite = "production-export"
statement = "Each production export schema under api/schemas validates the values the façade produces and refuses an unknown field, and its SHA-256 is recorded under its exact spec version in api/schemas/versions.toml, so that a schema changed without a new version fails the gate."

[[id]]
id = "TL-01"
level = "build"
suite = "tooling"
statement = "A tooling module is the one `toolingmodule` environment of its module, holding one canonical `\\toolingdata` argument of the closed `lexlean/tooling-module/1` schema, and every committed fixture satisfies `tooling/schemas/tooling-module.schema.json`; a member, declaration, term, signature, or atom outside it, a member written with its default, a spec tag but the exact one, a value that is not its own canonical encoding, a repeated member, a value nested deeper than the decoder reads, and an unsorted import list fail with LLT4013, a module over `max_ir_nodes` fails with LLS8002, a second data argument or a second module form in the same module is a structural error that fails with LLP2003, and no change of any single node of a committed fixture panics the compiler, which accepts or refuses it with LLT4013, LLT4014, or LLT4015."

[[id]]
id = "TL-02"
level = "build"
suite = "tooling"
statement = "A tooling module requires language 1.2 and a project the compiler itself embeds: a language-1.1 project, a user project, the check, build, and verify requests of the public API, and the command line refuse it with LLT4013 before either backend runs, no configuration member or option admits one, and a tooling module has no production root, no production eligibility report, and no semantic snapshot."

[[id]]
id = "TL-03"
level = "build"
suite = "tooling"
statement = "A tooling module cites one authority, Lean at the compiler's pinned release and source commit, which equal the pins of `model/authorities.toml`, and its registry is closed: an authority that is not the pin, a name declared twice, a signature or field type naming a constant that no registry row declares, a variable a signature does not bind, an empty, unsorted, or repeated plumbing row, a plumbing constant that is also declared, and a source path outside the toolchain source or a digest that is not 64 lowercase hexadecimal digits fail with LLT4014, and every source digest equals the SHA-256 of that file in the pinned toolchain."

[[id]]
id = "TL-04"
level = "build"
suite = "tooling"
statement = "A registered type states its parameters (a type, a type constructor, or an index drawn from a registered type whose constructors are all nullary), its complete constructor list in Lean's order with typed fields, and the one index a constructor exists at, an opaque type pins no constructors, and an abbreviation is the type it abbreviates wherever types are compared; an index of an unregistered or non-nullary type, a repeated constructor, a field naming an unregistered type, applying a type to the wrong number of arguments, or using a variable no parameter binds, a requirement that names no index parameter or a constructor of another type, an opaque type with constructors, and an abbreviation of itself or of a cycle fail with LLT4014."

[[id]]
id = "TL-05"
level = "build"
suite = "tooling"
statement = "A call's exact signature (constants, variables, applications, arrows, explicit, implicit, and instance binders, `Type` and `Type u`, `optParam` defaults, natural literals, and the empty structure instance) is its typing: the implicit binders of types and type constructors are the type arguments every use states, any other implicit binder and every instance binder is inferred by Lean and never stated, trailing binders with a default are optional, and types are compared exactly after the unfolding of abbreviations; a use with a wrong number of type arguments or arguments, an argument or result of another type, or an unregistered callee fails with LLT4015."

[[id]]
id = "TL-06"
level = "build"
suite = "tooling"
statement = "A tool is written in a closed typed term language with explicit binder types and type arguments, and its `match` is flat, one constructor per branch, and exhaustive at the scrutinee's index; a constructor available at the index without a branch, a branch for a constructor of another type or one that exists only at another index, a branch binding the wrong number of fields, a field of a type with several constructors, a condition that is not Bool, an unbound variable, a binder that shadows a variable in scope, and an ill-typed let, lambda, application, list, array, or constructor fail with LLT4015."

[[id]]
id = "TL-07"
level = "build"
suite = "tooling"
statement = "A function calls only registered calls, functions defined before it, itself when it is partial, and the functions of its mutual group, a contiguous run of partial functions with one label; a self call of a function that is not partial, a forward call, a mutual group that is not one run, and a group with a member that is not partial fail with LLT4015."

[[id]]
id = "TL-08"
level = "build"
suite = "tooling"
statement = "A traversal is a partial function that takes its subject first and is exactly a match on it, its group handles every type of the subject's recursive family, and each branch uses every field whose type lies in the family through the traversal of that type applied to a value derived from the field, so that a skipped field, a handler applied to the subject instead of the field, a handler that is not a traversal, a default branch, and a constructor that a registry gains and no branch handles fail with LLT4015, while a traversal of the real Lean `Code` family elaborates under the pinned Lean."

[[id]]
id = "TL-09"
level = "build"
suite = "tooling"
statement = "A command declares its syntax kind, a grammar of a leading token, identifiers, and signature types, and an elaborator with no parameters whose type is the abbreviation `Lean.Elab.Command.CommandElab`, an invocation supplies one identifier or signature tree per non-token atom, and an evaluation runs a function of the module on typed arguments, all as semantic data; an elaborator with a parameter or another type, a grammar without a leading token, an invocation of an unregistered command or with a wrong argument count or kind, and an evaluation of an unregistered function or with ill-typed arguments fail with LLT4015, and the pinned Lean runs the committed elaborator, which accepts a constant that exists and refuses one that does not."

[[id]]
id = "TL-10"
level = "build"
suite = "tooling"
statement = "Both backends traverse the one linked module: the Lean text begins with the fixed header, holds one rendering per function, command, invocation, and evaluation, and contains no comment, every declaration with output has one source-mapped piece, coverage is complete, the LaTeX document has one entry per declaration, and the pinned Lean elaborates every committed fixture without a message while refusing a registry that misstates an arity or a constructor list that the tool is consistent with."

[[id]]
id = "TL-11"
level = "build"
suite = "tooling"
statement = "Tooling modules are deterministic and content-addressed: each committed fixture's published build tree equals its golden byte for byte and across two clean builds in different directories, changing any declaration, registry row, source pin, or term changes the semantic ID, and the schema lies outside `schemas/` and so outside the compiler-semantics ID, which the committed locks of the three languages still record."

[[id]]
id = "AU-01"
level = "build"
suite = "authoring"
statement = "Every value of the closed semantic-module schema has one notation and the notation reads back to the value: every alternative of the declaration, term, type, and proof unions, with and without its optional members, is written and read back equal, a node that no readable form carries exactly is written generically, the notation is its own canonical form, and every committed semantic module is written and read back equal to its data."

[[id]]
id = "AU-02"
level = "build"
suite = "authoring"
statement = "A language-1.2 semantic module written in the authoring notation links to exactly the module its data form links to, with the same semantic ID and the same generated Lean and LaTeX byte for byte and source maps that relate each declaration to its text in the notation; fmt writes a module written as data in the notation, to the committed bytes, and leaves the notation unchanged, and the notation under language 1.1 is refused with LLP2003."

[[id]]
id = "AU-03"
level = "build"
suite = "authoring"
statement = "Malformed notation fails closed and never panics: an unclosed delimiter, a keyword used as a name, a literal that is not canonical, an unknown kind, and every single-token deletion, duplication, and replacement of a committed module fail with a registered code at a position in the notation or link to a module that decodes, and a numeral with a redundant leading zero is LLL1003 outside a string and is not one inside it."

[[id]]
id = "AU-04"
level = "build"
suite = "authoring"
statement = "No language-1.2 source of the product is written as data: every committed language-1.2 source with a semantic, tooling, or core module, in the compiler, the language libraries, the examples, and the positive fixtures, is written in the authoring notation and is canonical, the data form remains only under language 1.0 and 1.1 and in refused fixtures whose payload the notation cannot spell, and a refused fixture whose payload the notation can spell is a defect."

[[id]]
id = "AU-05"
level = "build"
suite = "authoring"
statement = "A language-1.2 tooling module written in the authoring notation links to exactly the module its data form links to, with the same semantic ID and the same generated Lean and LaTeX byte for byte and source maps that relate each declaration to its text in the notation; the notation and the canonical JSON of every committed tooling module are in bijection and the notation is its own canonical form; fmt writes a tooling module written as data as exactly the committed notation and leaves the notation unchanged; and malformed notation, and every single-token deletion and duplication of a committed tooling module, fails with a position or decodes, and nothing panics."


[[id]]
id = "AU-06"
level = "build"
suite = "authoring"
statement = "The compiler-semantics ID does not depend on the form a module of the embedded tree is written in: a semantic, tooling, or core module in the authoring notation contributes its data form, so the committed tree and the same tree with every such module written as data have one ID, a change to a module's meaning changes the ID in either form, the identity a preservation record states for the native library is over the same data forms, so it is the committed one, and the embedded tree holds at least one module written in the notation."

[[id]]
id = "AU-07"
level = "build"
suite = "authoring"
statement = "No product source is the output of a generator: every `.lex.tex` source of `compiler/`, `language/`, and `examples/` is written and edited as source, and no writer of the repository (the generators `cargo xtask check-calculus` compares and rewrites) emits one of them except the four fixture modules of `compiler/` (`TargetFixtures`, `ReasoningFixtures`, `GnafFixtures`, `GnafCertificates`), generated from committed fixtures, requests, and certificates, and the extraction adapter's module, generated from the registry the pinned Lean answers; a source emitted by any other writer is a defect."


[[id]]
id = "AU-08"
level = "build"
suite = "authoring"
statement = "The authoring API reads, writes, converts, and assembles the source of a module without a project: for every committed semantic and tooling source and every core source of at most twelve megabytes it reads the module it links to, writes it back in the form it has and in the other form, assembles the source from its header and data to the canonical notation, and is idempotent in each; and a source that is not a module, or whose notation is malformed, is an error with a position in the source and never a panic."

[[id]]
id = "AU-09"
level = "build"
suite = "authoring"
statement = "Every core module of the closed schema has one notation and the notation reads back to the module and to its data form: every committed core module reads back equal from its notation, its canonical JSON is the canonical JSON the compiler accepts and is, for a module written as data, byte for byte the data it was read from, the notation is its own canonical form, a node is written inside the node that uses it exactly when it is used once by the node after it and every other node is a statement, and a module that carries every kind of node, level, annotation, and declaration member is written and read back equal."

[[id]]
id = "AU-10"
level = "build"
suite = "authoring"
statement = "A language-1.2 core module written in the authoring notation links to exactly the module its data form links to, with the same semantic ID and the same generated Lean and LaTeX byte for byte and source maps that name the notation; fmt writes a core module written as data as the notation and leaves the notation unchanged; and the notation under language 1.0 and 1.1 is refused with LLP2003."

[[id]]
id = "AU-11"
level = "build"
suite = "authoring"
statement = "Malformed core notation fails closed and never panics: an unclosed delimiter, a keyword used as a name, a label that is not the number of its node, a reference to a node not yet written, a numeral with a redundant leading zero, a statement that defines no node, a nesting beyond the bound, and every single-token deletion and duplication of a committed module fail with a registered code at a position in the notation or link to a module that decodes."

[[id]]
id = "AU-12"
level = "build"
suite = "authoring"
statement = "A core module written with names for its statements and its variables reads to exactly the module its canonical notation reads to, and the canonical notation keeps the names of the binders and writes the numbers of the statements: a variable is written by the name of its binder exactly when no nearer binder has the name, a constant a binder in scope is named like is written as a string, a theorem added to the certification library by name reads to the committed module and is written as the committed bytes, and an unknown or repeated statement name and a variable given universe levels are refused with a position."
