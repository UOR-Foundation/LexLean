        run: |
          set -euo pipefail
          sudo fallocate -l 4G "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo chmod 600 "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo mkswap "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo swapon "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo sysctl vm.swappiness=10
          swapon --show
      - name: Run the join (the last modules, every shard's records, the attestation)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence ci-parts
          sample_resources() {
            set +e
            while true; do
              avail=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
              swap=$(awk '/^SwapTotal:/ {t=$2} /^SwapFree:/ {f=$2} END {print t-f}' /proc/meminfo)
              top=$( (ps -eo rss= --sort=-rss || true) | awk 'NR==1 {print $1}')
