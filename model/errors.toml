# model/errors.toml --- the closed public diagnostic registry (R1, R5, §26).
#
# Rows sort by code. `statement` is the §26.3 meaning byte-for-byte; `title`
# is that meaning without its terminal period. ERRORS.md is generated from
# this file, and `cargo xtask validate-model` rejects a code used anywhere
# that is absent here, and an unused registered code (§26.1).

spec = "lexlean/errors/1"

