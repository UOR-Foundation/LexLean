          path: ci-parts/${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: acceptance-gate-evidence-atlas-${{ matrix.shard }}
          path: ci-evidence
          if-no-files-found: error
          retention-days: 14

  # The join: the last four modules, then every shard's records in the
  # canonical order, the attestation, publication, and the comparison with
  # `expected/verify`.
  atlas-join:
    name: atlas (join)
    if: ${{ needs.plan.outputs.full == 'true' }}
    needs: [plan, atlas-prefix, atlas-l1, atlas-cert4-replay, atlas-closure, atlas-l3]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LEXLEAN_CI_TELEMETRY: ${{ github.workspace }}/ci-evidence
      # The part of the examples recipe this job runs (§9.4), and where the
      # parts of the run exchange their output.
      LEXLEAN_EXAMPLES_PART: join:uor-atlas
      LEXLEAN_EXAMPLES_PARTS: ${{ github.workspace }}/ci-parts
      # The resource profile of the examples leg (§22.11), the same for every
      # shard; operational only.
      LEXLEAN_VERIFY_WIDTH: "2"
      LEXLEAN_VERIFY_MEMORY_KIB: "12582912"
      LEXLEAN_VERIFY_HINTS: ${{ github.workspace }}/.github/verify-hints.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install elan and the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      # What the jobs of this run before this one wrote: the gate's executable
      # and every shard's output so far, each under the name it was uploaded
      # with. The verifier reads the shards this one needs and no other.
      - name: Take the gate's executable and the shards before this one from the run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: atlas-*
          path: ci-parts
      - name: Place the parts under the names of their shards
        shell: bash
        run: |
          set -euo pipefail
