id = "PD-01"
level = "build"
suite = "production"
statement = "The closed production registry fixes the language-1.2 targets, effects, and the disposition of every semantic construct kind, and every construct the eligibility analysis can classify has exactly one registry row."

[[id]]
id = "PD-02"
level = "build"
suite = "production"
statement = "Formal-only theorems, propositions, and non-executable definitions coexist with eligible executable production roots, and a module that declares no production root is never analysed for production."

[[id]]
id = "PD-03"
level = "build"
suite = "production"
statement = "A production root's runtime closure contains exactly its transitive computational dependencies across modules at their type instantiations, and its termination evidence is recorded as erased and never realized."

[[id]]
id = "PD-04"
level = "build"
suite = "production"
statement = "Production eligibility depends on the declared target: a construct that requires heap allocation is an admitted effect on a target with allocation and makes the root ineligible on a target without it."

[[id]]
id = "PD-05"
level = "build"
suite = "production"
statement = "A production root fails with LLT4005 before any backend runs when it declares type parameters or is not declared executable, when its boundary holds a universe, proposition, type parameter, or function, directly or in a named type's fields, or when its closure reaches a formal-only construct, a literal outside the target width, unavailable allocation, or an effect the root does not admit."

[[id]]
id = "PD-06"
level = "build"
suite = "production"
statement = "Every production root's eligibility report is a deterministic, schema-valid build artifact recording its runtime closure, realized types, erased dependencies, constructs, and per-target effects with their sources."

[[id]]
id = "PD-07"
level = "build"
suite = "production"
statement = "The eligibility analysis classifies every semantic construct by an explicit exhaustive match, and the exhaustiveness audit rejects a planted wildcard arm, rest pattern, implicit-default binding form, or unnamed IR variant."

[[id]]
id = "NE-01"
level = "build"
suite = "extraction"
statement = "Verifying a project with production roots extracts every root through Lean's compiler front end into one canonical compiler input whose bytes and ID are schema-valid, recorded in the attestation, and identical from distinct project directories, and a project without a production root publishes none."

[[id]]
id = "NE-02"
level = "build"
suite = "extraction"
statement = "Each root's extracted closure is exactly its computational dependencies, equals its production-eligibility closure, carries its runtime members and monomorphization instances, names every constant its code uses, marks recursion from the use graph, and records proof-only dependencies as erased and never as runtime members."

[[id]]
id = "NE-03"
level = "build"
suite = "extraction"
statement = "An unknown root, an opaque, axiomatic, unsafe, partial, or noncomputable dependency, an external implementation, an unresolved external, an unsupported compiler form, a kind that differs from the declared kind, and a malformed, noisy, or foreign extraction record fail closed with LLV7011, while a core definition its module exports as an axiom is admitted as that definition exactly when it is computable and Lean's compiler holds its code, and a borrowed type annotation canonicalizes to the type it annotates."

[[id]]
id = "NE-04"
level = "build"
suite = "extraction"
statement = "Every constant the extraction adapter uses is registered exactly once, as a call with its exact signature and pinned source identity, a type with its exact constructors, or plumbing; each extraction compares every signature structurally and the adapter's constants with the registry under pinned Lean, the adapter runs no LCNF pass, and drift of a signature, a constructor list, the adapter's constants, its output, or the Lean identity fails with LLV7012."

[[id]]
id = "NE-05"
level = "build"
suite = "extraction"
statement = "A dependency dropped from Lean's extracted facts or from the production-eligibility closure fails extraction with LLV7011 before any compiler input is published."

[[id]]
id = "NE-06"
level = "build"
suite = "extraction"
statement = "A proof-only dependency presented as a runtime closure member fails extraction with LLV7011 before any compiler input is published."

[[id]]
id = "TC-01"
level = "build"
suite = "calculus"
statement = "Hand-constructed target programs have canonical bytes and a SHA-256 content identity, alpha-equivalent programs canonicalize to identical bytes and identity, an ill-typed program has neither, and every committed fixture validates against the target schemas."

[[id]]
id = "TC-02"
level = "build"
suite = "calculus"
statement = "Every malformed target program or violated static rule fails closed with LLB6005, and an invalid program has neither a canonical form nor a rendering."

[[id]]
id = "TC-03"
level = "build"
suite = "calculus"
statement = "The calculus denotation is a kernel-checked LexLean definition that charges every evaluator operation, Lean's kernel reduces every kernel-reducible fixture to its expected outcome with its exact step count, no fixture program is stuck on its stated arguments or on seeded random well-typed arguments at any sampled fuel, and a wrong expected outcome is rejected by Lean."

[[id]]
id = "TC-04"
level = "build"
suite = "calculus"
statement = "Lean's evaluator, running the published calculus sources compiled again by pinned Lean, reproduces every fixture's expected outcome and step count, including fixtures a reflexivity proof cannot decide, and the comparison refuses a fixture stated one step off."

[[id]]
id = "TC-05"
level = "build"
suite = "calculus"
statement = "Every realization library template has a fixture whose outcome the kernel proves equal to the value LexLean's own collection primitive computes, committed instances equal their templates, and a mutated template is rejected by Lean."

[[id]]
id = "TC-06"
level = "build"
suite = "calculus"
statement = "Every runtime construct of the production registry has exactly one realization row naming existing calculus elements and requires allocation exactly when its realization does, and the fixtures exercise every calculus type, literal, expression, shape, primitive, and template, and every fixed-width primitive at every width it admits."

[[id]]
id = "TC-07"
level = "build"
suite = "calculus"
statement = "Every fixture with an observable outcome renders to a safe Rust library crate in rust-std, and in rust-core exactly when it needs no heap, that the pinned rustc compiles with warnings denied, that prints exactly the denotation's value or overflow, and whose counted work never exceeds the denotation's steps; planted value and work discrepancies are detected."

[[id]]
id = "RB-01"
level = "build"
suite = "rust-backend"
statement = "Every Rust rendering is built as a closed AST each of whose constructs carries the calculus element it realizes, every correspondence row and every AST node is exercised by a run package, and a construct whose row, width, or program does not justify its element is refused."

[[id]]
id = "RB-02"
level = "build"
suite = "rust-backend"
statement = "An exported name that is not a lowercase snake-case identifier, is a Rust keyword, imitates a generated name, or is declared by the runtime, a name exported twice, and an unavailable crate name each fail with LLB6005, and a crate binding one name twice in a function is refused."

[[id]]
id = "RB-03"
level = "build"
suite = "rust-backend"
statement = "An export that copies a parameter whose type is not Copy fails with LLB6005, and a crate that moves a value twice or reads it after moving it is refused."

[[id]]
id = "RB-04"
level = "build"
suite = "rust-backend"
statement = "A package whose boundary holds a function value at any depth, whose program computes a value of a type no value inhabits, or whose rust-core program needs the heap fails with LLB6005, and a rust-core crate naming any heap type, runtime function, or construct is refused."

[[id]]
id = "RB-05"
level = "build"
suite = "rust-backend"
statement = "A function that can overflow returns R<T> and every call to it propagates, any other returns its value, an export whose declared errors differ from its function's fails with LLB6005, and a crate that drops, invents, or misreturns a failure is refused."

[[id]]
id = "RB-06"
level = "build"
suite = "rust-backend"
statement = "Every committed package builds offline under its declared gates, rustc warnings and Clippy's default lints denied with ten documented exceptions, the export of each one with an observable outcome, called from a separate crate, prints exactly the denotation's observable outcome, and so does every primitive instance on its boundary and seeded inputs; a planted lint and a planted semantic mutation are detected."

[[id]]
id = "RB-07"
level = "build"
suite = "rust-backend"
statement = "Packages are deterministic and content-addressed: renderings by two separate processes under different roots and environments are byte-identical to each other and to the committed package, every manifest and provenance validates against its schema, the provenance binds the SHA-256 of each file, the program identity, the runtime LexLean's semantics records, the sources, and the language-1.2 compiler-semantics ID, and every committed package's sources are the semantic ID of the verified build stating its program."

[[id]]
id = "GN-01"
level = "build"
suite = "gnaf"
statement = "Every committed GNAF request and fixture is canonical, validates against the GNAF schemas whose calculus definitions are the target program schema's, and states its components' universe identity; a malformed request, an invalid reference, plan, or realized program, a reference without a value on a domain argument, or a wrong universe identity fails closed with LLB6006, and a machine or request beyond the host's capacity fails closed with LLS8002."

[[id]]
id = "GN-02"
level = "build"
suite = "gnaf"
statement = "The GNAF model is a kernel-checked LexLean definition, Lean's kernel reduces the universe, the system statuses, and the answer of every committed request to what the host transcription computes, and a wrong answer, an answer computed from a universe with a system omitted, a tie with a member dropped, and a universe with a system omitted are rejected by Lean."

[[id]]
id = "GN-03"
level = "build"
suite = "gnaf"
statement = "Candidate membership is the grammar's expansion, which a kernel-checked theorem proves equal to the grammar's well-formed selectors for every grammar, independent of evaluation and fixed by a universe identity before any optimizer, and optimizer-defined, discovered, cached, and internal-plan universes and missing, self-referential, or optimizer-citing completeness evidence are rejected."

[[id]]
id = "GN-04"
level = "build"
suite = "gnaf"
statement = "Every action a system performs is charged by steps, every admitted preparation action by a positive constant for each plan that needs it or by a prepared artifact bound in the common initial state, operands are charged by weight, and a request fits the capacity its machine binds; hidden zero-cost, free, undeclared, duplicated, unaccounted, unbound, stray, unit-cost, over-capacity, and unrealizable actions are rejected, and a plan's preparation enters exactly the cost of the systems that can run it."

[[id]]
id = "GN-05"
level = "build"
suite = "gnaf"
statement = "Scalar claims require the total step order and Pareto claims the componentwise steps-and-size order, a scalar claim over the partial order, a vector claim over the total order, the restricted-universe alias, an undecided claim class, and a scope beyond the grammar universe are rejected, equal-cost systems are all kept, a frontier answer has incomparable members, and GNAF-VEC-02 posed over the calculus has a frontier of exactly three of four systems for which no omission is certified and whose componentwise minima no system attains."

