[package]
name = "lexlean"
description = "A closed-lexicon LaTeX-to-Lean 4 compiler whose canonical document and prose-free Lean program are generated from one semantic representation."
# The document a consumer of the packaged crate reads first, and the two
# licence texts §2.4 requires, reached through the same in-crate link
# mechanism as the normative language data: one copy at the repository root,
# dereferenced by `cargo package` into the archive.
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
camino = { workspace = true }
clap = { workspace = true }
fs4 = { workspace = true }
same-file = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
unicode-normalization = { workspace = true }
walkdir = { workspace = true }

# Process groups are a unix notion. `rustix` signals a group without calling
# the system directly (this crate forbids unsafe code) and without a `kill`
# executable from the host; `signal-hook` turns SIGINT/SIGTERM/SIGHUP/SIGQUIT into an
# ordinary thread that ends the children before the process is, because a
# child in a group of its own no longer receives the terminal's Ctrl-C.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true }

[lints]
workspace = true
